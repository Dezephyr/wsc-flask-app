<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — Wall Street Capital</title>
<script>
  (function(){
    var t = localStorage.getItem("wsc_theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="auth-bg"></div>

<button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </svg>
</button>

<div class="auth-shell">
  <div class="brand-badge">
    <div class="v">WSC</div>
    <div class="label">Wall Street Capital</div>
  </div>

  <!-- Same card content as login.html — paste the entire <div class="auth-card">…</div>
       block from login.html, then add this one line at the end of the <body>
       to force the signup panel open: -->

  <!-- FULL COPY BELOW -->

  <div class="auth-card">
    <div class="auth-panel" id="panel-login">
      <h1>Welcome back</h1>
      <p class="sub">Enter your credentials to access your account.</p>
      <div class="error-box" id="login-error"></div>
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email address</label>
          <div class="input-icon">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <input id="login-email" type="email" placeholder="name@example.com" required>
          </div>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-icon">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="login-password" type="password" placeholder="••••••••" required>
          </div>
        </div>
        <div class="form-row-between">
          <label class="check"><input type="checkbox"><span class="box"></span>Remember me</label>
          <a href="/forgot.html">Forgot password?</a>
        </div>
        <button class="btn btn-solid btn-block" type="submit">Sign in &rarr;</button>
      </form>
      <div class="divider">or continue with</div>
      <div class="sso-row">
        <button class="sso-btn" type="button" onclick="ssoStub('Google')">Google</button>
        <button class="sso-btn" type="button" onclick="ssoStub('Apple')">Apple</button>
      </div>
      <div class="auth-footer">Don't have an account? <a href="/signup.html" id="to-signup">Sign up</a></div>
    </div>

    <div class="auth-panel active" id="panel-signup">
      <h1>Create account</h1>
      <p class="sub">Join us today to access the platform and services.</p>
      <div class="error-box" id="signup-error"></div>
      <form id="signup-form">
        <div class="field">
          <label for="signup-name">Full name</label>
          <div class="input-icon">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="signup-name" placeholder="Bruce Wayne" required>
          </div>
        </div>
        <div class="field">
          <label for="signup-email">Email address</label>
          <div class="input-icon">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <input id="signup-email" type="email" placeholder="name@example.com" required>
          </div>
           <div class="field">
          <label for="signup-phone">Phone Number</label>
          <div class="input-icon">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <input id="signup-phone" type="tel" placeholder="123-456-7890" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="signup-password">Password</label>
            <div class="input-icon">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="signup-password" type="password" placeholder="••••••••" minlength="10" required>
            </div>
          </div>
          <div class="field">
            <label for="signup-confirm">Confirm password</label>
            <div class="input-icon">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="signup-confirm" type="password" placeholder="••••••••" minlength="10" required>
            </div>
          </div>
        </div>
        <div class="form-row-between">
          <label class="check"><input type="checkbox" id="agree" required><span class="box"></span>I agree to the <a href="/terms.html">Terms</a> &amp; <a href="/privacy.html">Privacy Policy</a></label>
        </div>
        <button class="btn btn-solid btn-block" type="submit">Create account &rarr;</button>
      </form>
      <div class="divider">or continue with</div>
      <div class="sso-row">
        <button class="sso-btn" type="button" onclick="ssoStub('Google')">Google</button>
        <button class="sso-btn" type="button" onclick="ssoStub('Apple')">Apple</button>
      </div>
      <div class="auth-footer">Already have an account? <a href="/login.html" id="to-login">Sign in</a></div>
    </div>
  </div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script>
  function showPanel(name, push) {
    var login = document.getElementById("panel-login");
    var signup = document.getElementById("panel-signup");
    if (name === "signup") {
      login.classList.remove("active");
      signup.classList.add("active");
      if (push) history.pushState({ panel: "signup" }, "", "/signup.html");
    } else {
      signup.classList.remove("active");
      login.classList.add("active");
      if (push) history.pushState({ panel: "login" }, "", "/login.html");
    }
  }
  document.getElementById("to-signup").addEventListener("click", function (e) { e.preventDefault(); showPanel("signup", true); });
  document.getElementById("to-login").addEventListener("click", function (e) { e.preventDefault(); showPanel("login", true); });
  window.addEventListener("popstate", function () {
    showPanel(window.location.pathname.indexOf("signup") !== -1 ? "signup" : "login", false);
  });
  function ssoStub(provider) { alert(provider + " sign-in is not configured yet. Backend OAuth integration required."); }

  document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var errorBox = document.getElementById("login-error");
    errorBox.style.display = "none";
    try {
      var data = await Api.request("/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-password").value,
        }),
      });
      Api.setToken(data.token); Api.setUser(data.user);
      window.location.href = data.user.role === "admin" || data.user.role === "support" ? "/admin/index.html" : "/dashboard.html";
    } catch (err) { errorBox.textContent = err.message; errorBox.style.display = "block"; }
  });

  document.getElementById("signup-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var errorBox = document.getElementById("signup-error");
    errorBox.style.display = "none";
    var pw = document.getElementById("signup-password").value;
    var confirm = document.getElementById("signup-confirm").value;
    if (pw !== confirm) {
      errorBox.textContent = "Passwords do not match.";
      errorBox.style.display = "block";
      return;
    }
    try {
      var data = await Api.request("/auth/signup", {
        method: "POST",
        body: JSON.stringify({
          full_name: document.getElementById("signup-name").value,
          email: document.getElementById("signup-email").value,
          password: pw,
        }),
      });
      Api.setToken(data.token); Api.setUser(data.user);
      window.location.href = "/kyc.html";
    } catch (err) { errorBox.textContent = err.message; errorBox.style.display = "block"; }
  });
</script>
</body>
</html>
