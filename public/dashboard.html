<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Wall Street Capital</title>
<script>
  (function(){
    var t = localStorage.getItem("wsc_theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="/css/styles.css">
<style>
  .dash-app {
    display: grid;
    grid-template-columns: 250px 1fr 320px;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  @media (max-width: 1200px) {
    .dash-app { grid-template-columns: 250px 1fr; }
    .dash-rail { display: none !important; }
  }
  @media (max-width: 900px) {
    .dash-app { grid-template-columns: 1fr; }
  }

  .dash-sidebar {
    background: rgba(8, 15, 32, 0.85);
    border-right: 1px solid var(--line-soft);
    backdrop-filter: blur(24px);
    padding: 26px 16px 44px;
    position: sticky; top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  html[data-theme="light"] .dash-sidebar { background: rgba(240, 244, 251, 0.85); }
  .dash-sidebar::-webkit-scrollbar { width: 5px; }
  .dash-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  @media (max-width: 900px) {
    .dash-sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: 260px;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 60; height: 100dvh;
    }
    .dash-sidebar.open { transform: translateX(0); }
  }

    /* ---------- Sidebar greeting (replaces logo) ---------- */
  .sb-greeting {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 4px 18px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 18px;
  }
  .sb-greeting .sb-greet-eyebrow {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    font-weight: 600;
  }
  .sb-greeting .sb-greet-name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

    /* ---------- Topbar logo (fills the space where the greeting was) ---------- */
  .tb-logo {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    flex-shrink: 0;
    flex-grow: 1;
    max-width: 340px;
  }
  .tb-logo img {
    height: 64px;
    width: 100%;
    object-fit: contain;
    object-position: left center;
    filter: drop-shadow(0 0 8px rgba(212, 175, 106, 0.35));
  }
  @media (max-width: 900px) {
    .tb-logo {
      max-width: 200px;
    }
    .tb-logo img { height: 44px; }
  }

  .sb-user {
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 12px 16px;
    background: rgba(0, 8, 24, 0.4);
    border: 1px solid var(--line-soft);
    border-radius: 14px;
    margin-bottom: 20px;
    text-align: center;
  }
  html[data-theme="light"] .sb-user { background: rgba(255,255,255,0.6); }
  .sb-avatar {
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, #22D3EE, #0891B2);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; font-family: var(--serif);
    font-size: 20px; font-weight: 500;
    margin-bottom: 10px;
    position: relative;
  }
  .sb-avatar::after {
    content: "";
    position: absolute; bottom: 2px; right: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--tick-up);
    border: 2px solid var(--bg);
  }
  .sb-user .name {
    font-family: var(--serif); font-size: 14.5px;
    color: var(--text); margin-bottom: 2px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sb-user .status {
    font-size: 11px; color: var(--tick-up);
    margin-bottom: 10px;
  }
  .sb-balance {
    display: flex; flex-direction: column; gap: 2px;
    width: 100%; padding: 10px 12px;
    border-radius: 10px;
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(96, 165, 250, 0.2);
    text-align: left;
  }
  .sb-balance .label {
    font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dimmer);
  }
  .sb-balance .amount {
    font-family: var(--mono); font-size: 15px;
    color: var(--gold-bright);
  }

  .sb-group { margin-bottom: 16px; }
  .sb-group-title {
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dimmer);
    padding: 6px 12px; margin-bottom: 4px;
    font-weight: 600;
  }
  .sb-link {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 14px;
    color: var(--text-dim);
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 1px;
    cursor: pointer;
    position: relative;
  }
  .sb-link:hover {
    background: rgba(59, 130, 246, 0.08);
    color: var(--text);
  }
  .sb-link.active {
    background: rgba(59, 130, 246, 0.14);
    color: var(--text);
    box-shadow: inset 3px 0 0 var(--gold);
  }
  .sb-link svg {
    width: 15px; height: 15px;
    flex-shrink: 0;
    color: var(--text-dimmer);
    transition: color 0.15s;
  }
  .sb-link:hover svg, .sb-link.active svg { color: var(--gold-bright); }
  .sb-link .badge-live {
    margin-left: auto; font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 8px;
    background: rgba(74, 222, 128, 0.15);
    color: var(--tick-up);
    border: 1px solid rgba(74, 222, 128, 0.35);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sb-link .badge-premium {
    margin-left: auto; font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 8px;
    background: linear-gradient(135deg, #FBBF24, #B45309);
    color: #FFFFFF;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sb-link .badge-soon {
    margin-left: auto; font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 8px;
    background: rgba(96, 165, 250, 0.12);
    color: var(--gold-bright);
    border: 1px solid rgba(96, 165, 250, 0.3);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sb-link .caret {
    width: 12px; height: 12px;
    margin-left: auto;
    transition: transform 0.25s;
    color: var(--text-dimmer);
    flex-shrink: 0;
  }
  .sb-link.expanded .caret { transform: rotate(90deg); color: var(--gold-bright); }

  .sb-sub {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    padding-left: 14px;
    border-left: 1px solid var(--line-soft);
    margin-left: 18px;
  }
  .sb-sub.open { max-height: 300px; }
  .sb-sub-link {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 1px;
  }
  .sb-sub-link:hover { background: rgba(59, 130, 246, 0.08); color: var(--text); }
  .sb-sub-link.active { color: var(--gold-bright); background: rgba(59, 130, 246, 0.1); }
  .sb-sub-link svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--text-dimmer); }
  .sb-sub-link:hover svg, .sb-sub-link.active svg { color: var(--gold-bright); }

  .dash-main { display: flex; flex-direction: column; min-width: 0; }

  .dash-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(5, 11, 24, 0.75);
    backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 20;
  }
  html[data-theme="light"] .dash-topbar { background: rgba(240, 244, 251, 0.85); }

  .tb-left { display: flex; align-items: center; gap: 14px; }
  .tb-burger {
    display: none; width: 36px; height: 36px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text-dim);
    cursor: pointer; align-items: center; justify-content: center;
  }
  @media (max-width: 900px) { .tb-burger { display: flex; } }
  .tb-burger svg { width: 18px; height: 18px; }

  .tb-title-block { display: flex; flex-direction: column; gap: 1px; }
  .tb-eyebrow {
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dimmer);
    font-weight: 600;
  }
  .tb-title {
    font-family: var(--serif); font-size: 15.5px;
    color: var(--text); font-weight: 500;
  }

  .tb-right { display: flex; align-items: center; gap: 12px; }
  .tb-verified {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px;
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid rgba(74, 222, 128, 0.35);
    color: var(--tick-up);
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .tb-verified svg { width: 11px; height: 11px; }

  .tb-icon-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; position: relative;
  }
  .tb-icon-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
  .tb-icon-btn svg { width: 15px; height: 15px; }
  .tb-icon-btn .dot {
    position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--tick-down);
    border: 1.5px solid var(--bg);
  }
  /* Currency toggle */
  .tb-currency {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 20px;
    padding: 2px;
    cursor: pointer;
    user-select: none;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    overflow: hidden;
  }
  .tb-currency span {
    padding: 5px 11px;
    border-radius: 16px;
    color: var(--text-dimmer);
    transition: background 0.15s, color 0.15s;
  }
  .tb-currency span.active {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #FFFFFF;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
  }
  .tb-currency:hover {
    border-color: var(--gold);
  }

  .tb-user-chip {
    display: flex; align-items: center; gap: 9px;
    padding: 4px 11px 4px 4px;
    border-radius: 22px;
    border: 1px solid var(--line);
    background: var(--panel);
    cursor: pointer; transition: all 0.2s;
    max-width: 260px;
  }
  .tb-user-chip:hover { border-color: var(--gold); }
  .tb-user-chip .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #22D3EE, #0891B2);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; font-weight: 600; font-size: 10.5px;
    font-family: var(--serif);
    flex-shrink: 0;
  }
  .tb-user-chip .meta { display: flex; flex-direction: column; min-width: 0; }
  .tb-user-chip .name {
    font-size: 12.5px; color: var(--text); line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tb-user-chip .role {
    font-size: 10px; color: var(--text-dimmer); line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @media (max-width: 700px) {
    .tb-verified { display: none; }
    .tb-user-chip .meta { display: none; }
  }

  .dash-content {
    padding: 24px 26px 50px;
    max-width: 1200px;
    width: 100%;
  }
  @media (max-width: 700px) { .dash-content { padding: 18px; } }

  .page { display: none; }
  .page.active { display: block; animation: pageIn 0.35s ease-out; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dash-greeting {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 20px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .dash-greeting h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(22px, 3vw, 28px);
    margin: 0 0 6px; color: var(--text);
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap;
  }
  .badge-active {
    font-family: var(--sans);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--tick-up); padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(74, 222, 128, 0.35);
    background: rgba(74, 222, 128, 0.08);
  }
    .greet-balance {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 12px;
    padding: 8px 14px;
    border-radius: 12px;
    background: rgba(212, 175, 106, 0.08);
    border: 1px solid rgba(212, 175, 106, 0.22);
  }
  .greet-balance-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    font-weight: 600;
  }
  .greet-balance-amount {
    font-family: var(--mono);
    font-size: 20px;
    color: var(--gold-bright);
    font-weight: 600;
  }
  .dash-greeting .date {
    font-size: 12.5px; color: var(--text-dimmer);
    display: flex; align-items: center; gap: 8px;
  }
  .dash-greeting .date svg { width: 13px; height: 13px; }
  .dash-greeting .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    /* ---------- Overview balance card ---------- */
  .overview-balance-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 22px 26px;
    margin-bottom: 20px;
    border-radius: 16px;
    background: linear-gradient(135deg,
      rgba(212, 175, 106, 0.14) 0%,
      rgba(15, 26, 48, 0.85) 55%,
      rgba(5, 11, 24, 0.9) 100%);
    border: 1px solid rgba(212, 175, 106, 0.32);
    backdrop-filter: blur(24px);
    position: relative;
    overflow: hidden;
  }
  html[data-theme="light"] .overview-balance-card {
    background: linear-gradient(135deg,
      rgba(212, 175, 106, 0.10) 0%,
      rgba(255, 255, 255, 0.9) 55%,
      rgba(240, 244, 251, 0.95) 100%);
  }
  .overview-balance-card::before {
    content: "";
    position: absolute; top: -40%; right: -20%;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(212, 175, 106, 0.35), transparent 65%);
    filter: blur(40px); pointer-events: none;
  }
  .overview-balance-card .obc-left {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .overview-balance-card .obc-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    font-weight: 600;
  }
  .overview-balance-card .obc-amount {
    font-family: var(--mono);
    font-size: clamp(28px, 3.6vw, 38px);
    color: var(--text);
    line-height: 1.1;
    font-weight: 500;
  }
  .overview-balance-card .obc-sub {
    font-size: 12px;
    color: var(--text-dimmer);
  }
  .overview-balance-card .obc-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    position: relative; z-index: 1;
    flex-shrink: 0;
  }
  @media (max-width: 600px) {
    .overview-balance-card {
      flex-direction: column;
      align-items: flex-start;
    }
    .overview-balance-card .obc-actions {
      width: 100%;
    }
    .overview-balance-card .obc-actions .btn {
      flex: 1;
    }
  }
  .quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 800px) { .quick-actions { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { .quick-actions { grid-template-columns: 1fr; } }

  .qa-tile {
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    cursor: pointer;
    transition: all 0.25s;
    text-decoration: none;
  }
  .qa-tile:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.25),
                0 18px 36px rgba(59, 130, 246, 0.2);
  }
  .qa-icon {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    color: #FFFFFF;
  }
  .qa-icon svg { width: 22px; height: 22px; }
  .qa-tile.deposit .qa-icon  { background: linear-gradient(135deg, #4ADE80, #15803D); }
  .qa-tile.withdraw .qa-icon { background: linear-gradient(135deg, #60A5FA, #1D4ED8); }
  .qa-tile.trade .qa-icon    { background: linear-gradient(135deg, #C084FC, #7E22CE); }
  .qa-tile.invest .qa-icon   { background: linear-gradient(135deg, #FBBF24, #B45309); }
  .qa-label {
    font-family: var(--serif); font-size: 15px;
    color: var(--text); font-weight: 500;
    margin-bottom: 3px;
  }
  .qa-sub { font-size: 11.5px; color: var(--text-dimmer); }

  .link-wallet-card {
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.12) 0%, rgba(15, 26, 48, 0.9) 55%, rgba(5, 11, 24, 0.9) 100%);
    border: 1px solid rgba(96, 165, 250, 0.28);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(20px);
  }
  html[data-theme="light"] .link-wallet-card {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(255, 255, 255, 0.9) 55%, rgba(240, 244, 251, 0.95) 100%);
  }
  .link-wallet-card::before {
    content: "";
    position: absolute; top: -40%; right: -20%;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.3), transparent 65%);
    filter: blur(40px); pointer-events: none;
  }
  .link-wallet-card .lwc-icon {
    width: 60px; height: 60px; border-radius: 16px;
    background: linear-gradient(135deg, #60A5FA, #1D4ED8);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; margin: 0 auto 18px;
    box-shadow: 0 12px 28px rgba(59, 130, 246, 0.4);
    position: relative; z-index: 1;
  }
  .link-wallet-card .lwc-icon svg { width: 26px; height: 26px; }
  .link-wallet-card h3 {
    font-family: var(--serif); font-size: 22px;
    font-weight: 500; margin: 0 0 10px;
    color: var(--text);
    position: relative; z-index: 1;
  }
  .link-wallet-card p {
    font-size: 14px; color: var(--text-dim);
    max-width: 52ch; margin: 0 auto 22px;
    line-height: 1.65;
    position: relative; z-index: 1;
  }
  .link-wallet-card .btn {
    position: relative; z-index: 1;
    padding: 13px 28px;
    font-size: 14px;
  }

  .market-overview-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(20px);
    margin-bottom: 20px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .market-overview-card:hover {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.22), 0 18px 40px rgba(59, 130, 246, 0.18);
  }
  .market-overview-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
    gap: 12px; flex-wrap: wrap;
  }
  .market-overview-head h3 {
    font-family: var(--serif); font-size: 16.5px;
    font-weight: 500; margin: 0; color: var(--text);
  }
  .market-overview-head a {
    font-size: 12px; color: var(--gold-bright);
    text-decoration: none;
    cursor: pointer;
  }
  .market-overview-head a:hover { text-decoration: underline; }

  .crypto-chips {
    display: flex; gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .crypto-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-radius: 20px;
    background: rgba(0, 8, 24, 0.5);
    border: 1px solid var(--line);
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
  }
  html[data-theme="light"] .crypto-chip { background: rgba(255,255,255,0.7); }
  .crypto-chip:hover, .crypto-chip.active {
    border-color: var(--gold);

.tc-grid {

@media (max-width: 1100px) { .tc-grid { grid-template-columns: 1fr 1fr; } }

/* ---------- Card shell ---------- */
.tc-card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 18px 16px;
  backdrop-filter: blur(20px);
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
html[data-theme="light"] .tc-card { background: rgba(255,255,255,0.75); }

.tc-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.25),
              0 18px 36px rgba(59, 130, 246, 0.2);
}
/* ============================================================
   COPY TRADE PAYMENT MODAL
   ============================================================ */
.copy-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.copy-modal-backdrop.open { display: flex; }

.copy-modal {
  width: 100%;
  max-width: 460px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  backdrop-filter: blur(28px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  max-height: 92vh;
  overflow-y: auto;
  animation: cmIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
}
html[data-theme="light"] .copy-modal { background: #FFFFFF; }

@keyframes cmIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.cm-head {

}
.cm-close:hover { color: var(--gold-bright); border-color: var(--gold); }
.cm-close svg { width: 14px; height: 14px; }

.cm-trader {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(59, 130, 246, 0.06);
  border: 1px solid rgba(96, 165, 250, 0.2);
  margin-bottom: 18px;
}
.cm-trader-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #60A5FA, #1D4ED8);

  color: #fff; font-family: var(--serif); font-size: 16px;
  overflow: hidden; flex-shrink: 0;
}
.cm-trader-avatar img { width: 100%; height: 100%; object-fit: cover; }
.cm-trader-name {
  font-family: var(--serif); font-size: 15px;
  color: var(--text); font-weight: 500;
}
.cm-trader-sub {

  color: var(--text-dimmer);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Field wrappers */
.cm-field { margin-bottom: 16px; }
.cm-field label {
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 500;
  margin-bottom: 7px;
}
.cm-field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  background: rgba(0, 8, 24, 0.5);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
}

.cm-field input:focus {
  outline: none;
  border-color: rgba(96, 165, 250, 0.65);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
}
.cm-hint {
  font-size: 11px;
  color: var(--text-dimmer);
  margin-top: 5px;
}

  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.cm-source {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(0, 8, 24, 0.4);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: var(--sans);
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
}

.cm-source:hover { border-color: var(--gold); }
.cm-source.active {

.cm-src-name { font-size: 13px; font-weight: 600; }
.cm-src-sub {

  justify-content: flex-end;
  margin-bottom: 6px;

  font-weight: 700;

  text-transform: uppercase;
  padding: 3px 9px;

  color: var(--tick-up);
  background: rgba(74, 222, 128, 0.12);
  border: 1px solid rgba(74, 222, 128, 0.35);
}

/* ---------- Avatar / identity block ---------- */
.tc-avatar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-bottom: 14px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--line-soft);
}

.tc-avatar-lg {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #60A5FA, #1D4ED8);

  box-shadow: 0 10px 24px rgba(59, 130, 246, 0.32);
}
.tc-avatar-lg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.tc-name-lg {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.25;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 4px;
}

.tc-tier {
  display: inline-block;
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 12px;
  color: #C084FC;
  background: rgba(192, 132, 252, 0.12);
  border: 1px solid rgba(192, 132, 252, 0.35);
  margin-bottom: 8px;
}

.tc-stars {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 5px;
  font-size: 13px;
  line-height: 1;
}
.tc-stars .star { color: var(--text-dimmer); }
.tc-stars .star.filled { color: #FBBF24; }
.tc-stars .star.empty { color: rgba(251, 191, 36, 0.2); }
.tc-stars .reviews {
  font-size: 11px;
  color: var(--text-dimmer);
  margin-left: 5px;
  font-family: var(--mono);
}

.tc-followers {
  font-size: 11px;
  color: var(--text-dimmer);
  letter-spacing: 0.02em;
}

/* ---------- Stats row ---------- */
.tc-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.tc-stat {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  padding: 9px 6px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
html[data-theme="light"] .tc-stat { background: rgba(0,0,0,0.03); }

.tc-stat .value {
  font-family: var(--mono);
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.15;
}
.tc-stat .value.up { color: var(--tick-up); }
.tc-stat .value.down { color: var(--tick-down); }

.tc-stat .label {
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  font-weight: 600;
}

/* Progress bar for win-rate */
.tc-stat .bar {
  height: 3px;
  width: 100%;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  margin-top: 4px;
  overflow: hidden;
}
.tc-stat .bar .fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #4ADE80, #15803D);
  transition: width 0.4s ease;
}

/* ---------- Minimum investment row ---------- */
.tc-min {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(59, 130, 246, 0.06);
  border: 1px solid rgba(96, 165, 250, 0.2);
  margin-bottom: 12px;
}
.tc-min .label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  font-weight: 600;
}
.tc-min .value {
  font-family: var(--mono);
  font-size: 13.5px;
  color: var(--gold-bright);
  font-weight: 600;
}

/* ---------- Action button ---------- */
.tc-action { margin-top: auto; }

.tc-action button {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #FFFFFF;
  background: linear-gradient(135deg, #4ADE80, #15803D);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  box-shadow: 0 6px 18px rgba(74, 222, 128, 0.3);
}
.tc-action button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(74, 222, 128, 0.45);
}
.tc-action button:disabled {
  cursor: not-allowed;
  opacity: 0.7;
  transform: none;
  box-shadow: none;
  background: linear-gradient(135deg, rgba(74, 222, 128, 0.35), rgba(21, 128, 61, 0.35));
}
.tc-action button svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

/* Stop-copying variant (used on "My copies" tab) */
.tc-action button.stop {
  background: linear-gradient(135deg, #FB7185, #BE123C);
  box-shadow: 0 6px 18px rgba(248, 113, 113, 0.3);
}
.tc-action button.stop:hover:not(:disabled) {
  box-shadow: 0 8px 24px rgba(248, 113, 113, 0.45);
}
.tc-action button.pending {
  background: linear-gradient(135deg, rgba(251,191,36,0.35), rgba(180,83,9,0.35));
  color: #FDE68A;
  box-shadow: none;
}

   .mn-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px;
    text-decoration: none;
    cursor: pointer;
    color: var(--text-dimmer);
    transition: color 0.18s;
    position: relative;
  }
  .mn-item:hover { color: var(--text-dim); }

  /* Icon container — rounded square behind the icon */
  .mn-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    background: transparent;
    color: var(--text-dimmer);
    position: relative;
  }
  .mn-icon svg { width: 22px; height: 22px; }

  /* Label */
  .mn-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-dimmer);
    transition: color 0.18s;
  }

  /* ---------- ACTIVE state ---------- */
  .mn-item.active .mn-icon {
    background: linear-gradient(135deg, rgba(96,165,250,0.22), rgba(59,130,246,0.12));
    color: var(--gold-bright);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 0 0 1px rgba(96,165,250,0.18);
  }
  html[data-theme="light"] .mn-item.active .mn-icon {
    background: linear-gradient(135deg, rgba(59,130,246,0.14), rgba(29,78,216,0.08));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.6),
      0 0 0 1px rgba(59,130,246,0.2);
  }
  .mn-item.active .mn-label { color: var(--gold-bright); }

  /* Small blue underline bar below the label when active */
  .mn-item.active::after {
    content: "";
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 3px;
    border-radius: 3px;
    background: var(--gold-bright);
    box-shadow: 0 0 10px rgba(96,165,250,0.6);
  }

  /* Center Home button — big blue circle that pops up above the bar */
  .mn-home {
    position: relative;
    flex: 1;
    padding-top: 0;
  }
  .mn-home-btn {
    width: 60px; height: 60px;
    margin-top: -32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #60A5FA, #1D4ED8);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF;
    box-shadow:
      0 12px 28px rgba(59, 130, 246, 0.5),
      0 0 0 6px rgba(15, 26, 48, 0.95);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  html[data-theme="light"] .mn-home-btn {
    box-shadow:
      0 12px 28px rgba(59, 130, 246, 0.4),
      0 0 0 6px rgba(255, 255, 255, 0.98);
  }
  .mn-home-btn svg { width: 26px; height: 26px; }
  .mn-home:active .mn-home-btn { transform: scale(0.94); }
  .mn-home .mn-label {
    margin-top: 2px;
    color: var(--text-dim);
  }
  .mn-home.active .mn-label { color: var(--gold-bright); }

  .mn-sheet {

    border: 1px solid rgba(255, 255, 255, 0.1);

  html[data-theme="light"] .mn-sheet {

    to   { transform: translateY(0); }

  .mn-sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.18);

  .mn-sheet-title {
    font-family: var(--serif);
    font-size: 16px;
    color: var(--text);
    font-weight: 500;
    text-align: center;
    margin-bottom: 14px;
  }

  .mn-sheet-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 6px;
  }
  .mn-sheet-item:hover,
  .mn-sheet-item:active { background: rgba(96, 165, 250, 0.1); }

  .mn-sheet-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  }

  .mn-sheet-meta { min-width: 0; }
  .mn-sheet-name {

  }

    /* ============================================================
     MARKETS PAGE — Order book
     ============================================================ */
  .ob-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    backdrop-filter: blur(20px);
    margin-bottom: 20px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .ob-wrap:hover {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.22),
                0 18px 40px rgba(59, 130, 246, 0.18);
  }

  .ob-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line-soft);
    gap: 12px;
    flex-wrap: wrap;
  }
  .ob-head-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ob-head-left svg {
    width: 18px; height: 18px;
    color: var(--gold-bright);
  }
  .ob-head-title {
    font-family: var(--serif);
    font-size: 16.5px;
    font-weight: 500;
    color: var(--text);
  }
  .ob-head-pair {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dimmer);
    letter-spacing: 0.04em;
  }

  /* Column headers */
  .ob-cols {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 0 6px 8px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 8px;
  }
  .ob-cols span {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    font-weight: 600;
  }
  .ob-cols span:nth-child(2),
  .ob-cols span:nth-child(3) { text-align: right; }

  /* Rows */
  .ob-rows {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 340px;
    overflow: hidden;
  }
  .ob-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 6px;
    position: relative;
    font-family: var(--mono);
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .ob-row:hover { background: rgba(96, 165, 250, 0.06); }

  /* Depth bar behind the row */
  .ob-row::before {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: var(--depth, 0%);
    border-radius: 6px;
    pointer-events: none;
  }
  .ob-row.ask::before { background: rgba(248, 113, 113, 0.10); }
  .ob-row.bid::before { background: rgba(74, 222, 128, 0.10); }

  .ob-row > span {
    position: relative;
    z-index: 1;
  }
  .ob-row .ob-price { text-align: left; }
  .ob-row .ob-amt,
  .ob-row .ob-total { text-align: right; }

  .ob-row.ask .ob-price { color: var(--tick-down); }
  .ob-row.bid .ob-price { color: var(--tick-up); }
  .ob-row .ob-amt,
  .ob-row .ob-total { color: var(--text-dim); }

  /* Spread row */
  .ob-spread {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 6px;
    margin: 8px 0;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
  }
  .ob-spread-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ob-spread-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dimmer);
    font-weight: 600;
  }
  .ob-spread-price {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
  }
  .ob-spread-right {
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: flex-end;
  }
  .ob-spread-value {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--gold-bright);
    font-weight: 600;
  }
  .ob-spread-pct {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dimmer);
  }

  /* Pair switcher pills */
  .ob-pairs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .ob-pair {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ob-pair:hover { border-color: var(--gold); color: var(--text); }
  .ob-pair.active {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #FFFFFF;
    border-color: var(--gold);
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
  }

  /* Status strip at the top of the panel */
  .ob-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--text-dimmer);
    font-family: var(--mono);
  }
  .ob-status .dot-live {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--tick-up);
    box-shadow: 0 0 8px var(--tick-up);
    animation: obPulse 2s ease-in-out infinite;
  }
  @keyframes obPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  @media (max-width: 600px) {
    .ob-wrap { padding: 16px; border-radius: 12px; }
    .ob-row { font-size: 11.5px; padding: 5px 4px; }
    .ob-spread-price { font-size: 18px; }
    .ob-rows { max-height: 260px; }
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function initials(str) {
    if (!str) return "U";
    const p = String(str).trim().split(/\s+/);
    if (p.length >= 2) return (p[0][0] + p[1][0]).toUpperCase();
    return p[0].slice(0, 2).toUpperCase();
  }
  function iconSvg(name) {
    const p = ICONS[name] || ICONS.home;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
  }
  function badgeHtml(badge) {
    if (badge === "live")    return '<span class="badge-live">Live</span>';
    if (badge === "premium") return '<span class="badge-premium">Premium</span>';
    if (badge === "soon")    return '<span class="badge-soon">Soon</span>';
    return "";
  }
  function fmtMoney(n) {
    const v = parseFloat(n || 0);
    return "$" + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtMoneySigned(n) {
    const v = parseFloat(n || 0);
    return (v >= 0 ? "+" : "−") + "$" + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

/**

function assetAvatarHtml(symbolOrCoin, logoUrl, size) {
  const s = String(symbolOrCoin || "?").trim();
  const sz = size || 44;
  const initials = s.replace(/[^A-Za-z0-9]/g, "").slice(0, 3).toUpperCase() || "?";
  const inner = logoUrl
    ? `<img src="${escapeHtml(logoUrl)}" alt="${escapeHtml(s)}"
            style="width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff;padding:4px;"
            onerror="this.replaceWith(Object.assign(document.createElement('span'),
              {textContent:'${escapeHtml(initials)}',
               style:'font-family:var(--serif);font-weight:700;color:var(--gold-bright);font-size:${Math.round(sz*0.36)}px;'}))">`
    : `<span style="font-family:var(--serif);font-weight:700;color:var(--gold-bright);font-size:${Math.round(sz*0.36)}px;letter-spacing:0.02em;">${escapeHtml(initials)}</span>`;
  return `<div style="width:${sz}px;height:${sz}px;border-radius:50%;
                       background:linear-gradient(135deg,rgba(96,165,250,0.15),rgba(29,78,216,0.06));
                       border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
                       flex-shrink:0;overflow:hidden;">${inner}</div>`;
}

  function wrapTablesForMobile(root) {
    const scope = root || document.getElementById("dash-content");
    if (!scope) return;
    scope.querySelectorAll("table").forEach(tbl => {
      if (tbl.parentElement && tbl.parentElement.classList.contains("table-scroll")) return;
      const wrapper = document.createElement("div");
      wrapper.className = "table-scroll";
      tbl.parentNode.insertBefore(wrapper, tbl);
      wrapper.appendChild(tbl);
    });

    /* ============================================================
     CURRENCY DISPLAY (USD / NGN)
     Display-only conversion. Values are always stored in USD.
     ============================================================ */
  const CURRENCY = {
    current: (localStorage.getItem("wsc_currency") || "USD").toUpperCase(),
    rate: 1650,

    set(cur) {
      this.current = (cur || "USD").toUpperCase();
      localStorage.setItem("wsc_currency", this.current);
      // Re-render current page + sidebar so all values update
      if (typeof state !== "undefined") {
        const sb = document.getElementById("sb-balance-value");
        if (sb) sb.textContent = this.fmt(state.lastKnownCash || 0);
        const rb = document.getElementById("rail-balance");
        if (rb) rb.textContent = this.fmt(state.lastKnownCash || 0);
      }
    },

    // Convert a USD number for display
    value(usd) {
      const v = parseFloat(usd || 0);
      if (this.current === "NGN") return v * this.rate;
      return v;
    },

    // Symbol for current currency
    symbol() {
      return this.current === "NGN" ? "₦" : "$";
    },

    // Format a USD value in current display currency
    fmt(usd, opts = {}) {
      const v = this.value(usd);
      const min = opts.minimumFractionDigits ?? 2;
      const max = opts.maximumFractionDigits ?? 2;
      return this.symbol() + v.toLocaleString(undefined, {
        minimumFractionDigits: min,
        maximumFractionDigits: max,
      });
    },

    // Format signed (±) for P/L
    fmtSigned(usd) {
      const v = this.value(usd);
      const sign = v >= 0 ? "+" : "−";
      return sign + this.symbol() + Math.abs(v).toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    },
  };

    async submit() {
    const amount = parseFloat(this.amountEl.value);
    const min = parseFloat(this.trader.minimum_investment || 0);
    const errEl = this.errorEl;

    const fail = (msg) => {
      errEl.textContent = msg;
      errEl.style.display = "block";
    };
    errEl.style.display = "none";

    if (!amount || amount <= 0) return fail("Enter a valid amount.");
    if (amount < min) return fail("Amount must be at least $" + min.toFixed(2) + ".");

    if (this.source === "balance" && amount > this.availableBalance) {
      return fail("Insufficient balance. You have " + fmtMoney(this.availableBalance) + ".");
    }

    // If the user picked wallet, send them to the wallet-link flow.
    // We remember the copy-trade params so we can resume after linking.
    if (this.source === "wallet") {
      const savedWallet = state.wallets.find(w => w.status === "stored");
      if (!savedWallet) {
        // No wallet on file — detour to the Link Wallet modal.
        pendingCopy = {
          traderId: this.trader.id,
          amount: amount,
        };
        this.close();
        goToPage("wallet");
        return;
      }
      // Otherwise fall through — a stored wallet exists, use it below.
    }

    this.confirmBtn.disabled = true;
    this.confirmBtn.textContent = "Processing…";

    try {
      const payload = {
        amount: amount,
        source: this.source,
      };

      if (this.source === "wallet") {
        const savedWallet = state.wallets.find(w => w.status === "stored");
        if (!savedWallet) {
          // Race condition fallback — should never happen
          pendingCopy = { traderId: this.trader.id, amount: amount };
          this.close();
          goToPage("wallet");
          return;
        }
        payload.wallet_id = savedWallet.wallet_id;
        payload.wallet_address = savedWallet.address;
        payload.tx_hash = null;
      }

      await Api.request("/portfolio/copy-traders/" + this.trader.id, {
        method: "POST",
        body: JSON.stringify(payload),
      });

      pendingCopy = null;
      this.close();

      await loadTraders();
      await loadMyCopies();
      renderCopyTabs();
      refreshUnreadDot();

      alert("Your copy-trade request is pending admin approval. You'll be notified once it's reviewed.");
    } catch (err) {
      fail(err.message || "Could not start copy trading.");
      this.confirmBtn.disabled = false;
      this.confirmBtn.textContent = "Confirm & start";
              // If the user was detoured here from a copy-trade, resume it.
        if (pendingCopy) {
          const resume = pendingCopy;
          pendingCopy = null;
          // Small delay so the success alert has a chance to be dismissed
          setTimeout(() => {
            const trader = state.traders.find(t => String(t.id) === String(resume.traderId));
            if (!trader) return;
            // Re-open the copy modal with the wallet source pre-selected
            copyModal.open(trader);
            // Give the modal a tick to render, then flip to wallet & fill amount
            setTimeout(() => {
              const walletBtn = document.querySelector('.cm-source[data-source="wallet"]');
              if (walletBtn) {
                copyModal.source = "wallet";
                document.querySelectorAll(".cm-source").forEach(b => {
                  b.classList.toggle("active", b === walletBtn);
                });
              }
              const amtEl = document.getElementById("cm-amount");
              if (amtEl) amtEl.value = Number(resume.amount).toFixed(2);
            }, 60);
          }, 400);
        }
    }
  },

  async connectWalletForPayment() {
    // Reuse the same provider detection logic as connectWallet().
    // We just need an address + optional tx signature here.

    if (typeof window.ethereum !== "undefined") {
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        if (!accounts || !accounts.length) return null;

        // Optional: request a personal_sign so the backend can verify ownership.
        // Remove this block if your backend only needs the address.
        let txHash = null;
        try {
          const message = `Authorize copy-trade payment of $${parseFloat(this.amountEl.value).toFixed(2)} to trader ${this.trader.id}`;
          txHash = await window.ethereum.request({
            method: "personal_sign",
            params: [message, accounts[0]],
          });
        } catch (_) { /* user declined signature, but let backend decide */ }

        return {
          wallet_id: "metamask",
          address: accounts[0],
          tx_hash: txHash,
        };
      } catch (err) {
        if (err.code === 4001) return null;
        this.errorEl.textContent = "Wallet error: " + (err.message || "unknown");
        this.errorEl.style.display = "block";
        return null;
      }
    }

    if (window.solana && window.solana.isPhantom) {
      try {
        const resp = await window.solana.connect();
        return {
          wallet_id: "phantom",
          address: resp.publicKey.toString(),
          tx_hash: null,
        };
      } catch (err) {
        return null;
      }
    }

    this.errorEl.textContent =
      "No wallet extension detected. Install MetaMask or Phantom, or pay from your account balance.";
    this.errorEl.style.display = "block";
    return null;
  },
};

  async function loadOrderBook() {
    const asksEl   = document.getElementById("ob-asks");
    const bidsEl   = document.getElementById("ob-bids");
    const spotEl   = document.getElementById("ob-spot");
    const spreadEl = document.getElementById("ob-spread");
    const pctEl    = document.getElementById("ob-spread-pct");
    const statusEl = document.getElementById("ob-status-text");
    if (!asksEl || !bidsEl) return;

    const symbol = OB_STATE.pair;
    const url = `https://api.binance.com/api/v3/depth?symbol=${encodeURIComponent(symbol)}&limit=20`;

    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`Binance responded ${res.status}`);
      const data = await res.json();

      const rawAsks = (data.asks || []).map(([p, q]) => [parseFloat(p), parseFloat(q)]);
      const rawBids = (data.bids || []).map(([p, q]) => [parseFloat(p), parseFloat(q)]);

      // Binance returns asks ascending (best/lowest ask first) and bids descending (best/highest bid first).
      // For a visual ladder we want the highest ask at the top and lowest ask nearest the spread.
      // So asks: sort descending so best ask ends up at the bottom of the list (nearest the spread).
      const asksSorted = rawAsks.slice().sort((a, b) => b[0] - a[0]).slice(0, 10);
      const bidsSorted = rawBids.slice().sort((a, b) => b[0] - a[0]).slice(0, 10);

      // Cumulative totals (in quote currency = USD-equivalent)
      function withCumulative(rows) {
        let running = 0;
        return rows.map(([p, q]) => {
          running += p * q;
          return { price: p, amount: q, total: running };
        });
      }

      const asks = withCumulative(asksSorted).reverse(); // highest at top
      const bids = withCumulative(bidsSorted);           // highest at top, so best bid nearest spread

      // For asks: we want them displayed highest → lowest top to bottom. Above code already did that.
      // Depth bars: scale to the max cumulative across both sides.
      const maxTotal = Math.max(
        ...asks.map(r => r.total),
        ...bids.map(r => r.total),
        1
      );

      renderObSide(asksEl, asks, "ask", maxTotal);
      renderObSide(bidsEl, bids, "bid", maxTotal);

      // Spot price = midpoint between best bid and best ask
      const bestBid = rawBids[0] ? rawBids[0][0] : 0;
      const bestAsk = rawAsks[0] ? rawAsks[0][0] : 0;
      const mid = (bestBid && bestAsk) ? (bestBid + bestAsk) / 2 : (bestBid || bestAsk);

      if (spotEl) spotEl.textContent = fmtMoney(mid);
      if (spreadEl) spreadEl.textContent = fmtMoney(bestAsk - bestBid);
      if (pctEl) {
        const pct = mid > 0 ? ((bestAsk - bestBid) / mid) * 100 : 0;
        pctEl.textContent = pct.toFixed(3) + "%";
      }

      if (statusEl) {
        statusEl.textContent = "Live · updated " + new Date().toLocaleTimeString();
      }
      OB_STATE.lastGood = { asks, bids, mid };

    } catch (err) {
      // Keep the last good render on screen so it doesn't flash empty on a single failure.
      if (!OB_STATE.lastGood) {
        asksEl.innerHTML = "";
        bidsEl.innerHTML = "";
        if (statusEl) statusEl.textContent = "Connection error: " + err.message;
      } else if (statusEl) {
        statusEl.textContent = "Reconnecting…";
      }
    }
  }

  function renderObSide(container, rows, side, maxTotal) {
    container.innerHTML = rows.map(r => {
      const pct = Math.min(100, (r.total / maxTotal) * 100);
      return `
        <div class="ob-row ${side}" style="--depth:${pct}%;">
          <span class="ob-price">${r.price.toLocaleString(undefined, { maximumFractionDigits: 8 })}</span>
          <span class="ob-amt">${r.amount.toLocaleString(undefined, { maximumFractionDigits: 6 })}</span>
          <span class="ob-total">${r.total.toLocaleString(undefined, { maximumFractionDigits: 2 })}</span>
        </div>`;
    }).join("");
  }

function renderStockCatalog() {
  const el = document.getElementById("sm-catalog-list");
  const countEl = document.getElementById("sm-catalog-count");
  if (!el) return;

  if (countEl) countEl.textContent = STOCK_CATALOG.length + " symbols";

  el.innerHTML = STOCK_CATALOG.map(s => {
    const logo   = stockLogoUrl(s.symbol, s.name);
    const avatar = assetAvatarHtml(s.symbol, logo, 44);
    const active = (typeof SM !== "undefined" && SM.symbol === s.symbol) ? " active" : "";
    return `
      <div class="tc-card" style="cursor:pointer;padding:12px;" data-pick="${escapeHtml(s.symbol)}">
        <div style="display:flex;align-items:center;gap:10px;">
          ${avatar}
          <div style="min-width:0;flex:1;">
            <div style="font-family:var(--mono);font-weight:700;color:var(--gold-bright);font-size:14px;line-height:1.2;">
              ${escapeHtml(s.symbol)}
            </div>
            <div style="font-size:11px;color:var(--text-dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              ${escapeHtml(s.name)}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");

  el.querySelectorAll("[data-pick]").forEach(card => {
    card.addEventListener("click", () => {
      smSelectSymbol(card.dataset.pick);
      // Highlight the selected card
      el.querySelectorAll("[data-pick]").forEach(c => c.classList.remove("active"));
      card.classList.add("active");
      // Bring the chart into view so the user sees it change
      const chartCard = document.querySelector("#sm-chart-canvas");
      if (chartCard && chartCard.scrollIntoView) {
        chartCard.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  });
}

async function bindBotHub() {
  // ---- filter tabs ----
  const tabs = document.getElementById("bot-filter-tabs");
  if (tabs) {
    tabs.querySelectorAll("[data-botcat]").forEach(t => {
      t.addEventListener("click", () => {
        tabs.querySelectorAll("[data-botcat]").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        loadBotCatalog(t.dataset.botcat);
      });
    });
  }

  await loadBotCatalog("all");
  await loadMyBotInvestments();
}

async function loadBotCatalog(category) {
  const grid = document.getElementById("bot-catalog-grid");
  if (!grid) return;
  grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">' +
                   '<span class="loading-dots">Loading bots</span></div>';

  try {
    const url = "/bots" + (category && category !== "all" ? "?category=" + category : "");
    const rows = await Api.request(url);

    if (!rows.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">' +
                       'No bots available in this category yet.</div>';
      return;
    }

    grid.innerHTML = rows.map(b => botCardHtml(b)).join("");
    grid.querySelectorAll("[data-bot-invest]").forEach(btn => {
      btn.addEventListener("click", () => openBotInvestModal(
        rows.find(x => x.id === btn.dataset.botInvest)
      ));
    });
  } catch (err) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Could not load bots: ${escapeHtml(err.message)}</div>`;
  }
}

      <div class="bot-card-head">
        <div class="bot-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">

            <circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/>

async function loadMyBotInvestments() {
  const el = document.getElementById("bot-mine-list");
  const countEl = document.getElementById("bot-mine-count");
  if (!el) return;

  try {
    const rows = await Api.request("/bots/me");
    if (countEl) countEl.textContent = rows.filter(r => r.status === "active").length;

    if (!rows.length) {
      el.innerHTML = '<div class="empty-state">You have no bot investments yet.</div>';
      return;
    }

    el.innerHTML = `<table class="holdings-table">
      <thead>
        <tr>
          <th>Bot</th><th>Category</th><th>Amount</th>
          <th>Accrued</th><th>Matures</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td class="sym">${escapeHtml(r.bot_name)}</td>
            <td>${escapeHtml(r.category)}</td>
            <td class="mono">${CURRENCY.fmt(r.amount_usd)}</td>
            <td class="mono up">${CURRENCY.fmt(r.accrued_usd || 0)}</td>
            <td class="mono">${r.matures_at ? new Date(r.matures_at).toLocaleDateString() : "—"}</td>
            <td><span class="type-badge ${r.status === "active" ? "deposit" : r.status === "matured" ? "withdrawal" : "neutral"}">${escapeHtml(r.status)}</span></td>
            <td>
              ${r.status === "active"
                ? `<button class="btn" data-bot-cashout="${escapeHtml(r.id)}" style="padding:6px 12px;font-size:12px;">Cash out</button>`
                : ""}
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>`;

    el.querySelectorAll("[data-bot-cashout]").forEach(btn => {
      btn.addEventListener("click", () => cashOutBot(btn.dataset.botCashout));
    });
  } catch (err) {
    el.innerHTML = `<div class="empty-state">Could not load your bot investments: ${escapeHtml(err.message)}</div>`;
  }
}

function openBotInvestModal(bot) {
  if (!bot) return;

  const modal = document.getElementById("bot-invest-modal");
  if (!modal) return;

  document.getElementById("bim-bot-name").textContent = bot.name;
  document.getElementById("bim-bot-tagline").textContent =
    (bot.tagline || bot.category) + " · " + bot.duration_days + " days";
  document.getElementById("bim-amount").value = bot.min_amount.toFixed(2);
  document.getElementById("bim-amount").min   = bot.min_amount;
  document.getElementById("bim-amount").max   = bot.max_amount;
  document.getElementById("bim-min-hint").textContent =
    "Min $" + bot.min_amount.toFixed(2) + " · Max $" + bot.max_amount.toFixed(2);
  document.getElementById("bim-error").style.display = "none";
  document.getElementById("bim-success").style.display = "none";

  modal.classList.add("open");
  document.body.style.overflow = "hidden";

  const confirmBtn = document.getElementById("bim-confirm");
  confirmBtn.onclick = async () => {
    const amount = parseFloat(document.getElementById("bim-amount").value);
    const errEl  = document.getElementById("bim-error");
    const okEl   = document.getElementById("bim-success");
    errEl.style.display = "none";
    okEl.style.display  = "none";

    if (!amount || amount < bot.min_amount) {
      errEl.textContent = "Minimum is $" + bot.min_amount.toFixed(2);
      errEl.style.display = "block";
      return;
    }
    if (amount > bot.max_amount) {
      errEl.textContent = "Maximum is $" + bot.max_amount.toFixed(2);
      errEl.style.display = "block";
      return;
    }

    confirmBtn.disabled = true;
    confirmBtn.textContent = "Investing…";

    try {

async function submitInvestment(planId) {
  const amtEl = document.getElementById(`inv-amount-${planId}`);
  const errEl = document.querySelector(`[data-invest-error="${planId}"]`);
  const okEl  = document.querySelector(`[data-invest-success="${planId}"]`);

  const showErr = (m) => { if (errEl) { errEl.textContent = m; errEl.style.display = "block"; } };
  const clearMsgs = () => {
    if (errEl) errEl.style.display = "none";
    if (okEl)  okEl.style.display  = "none";
  };
  clearMsgs();

  const amount = parseFloat((amtEl && amtEl.value) || 0);
  if (!amount || amount <= 0) return showErr("Enter an amount greater than zero.");

  const btn = document.querySelector(`[data-invest-confirm="${planId}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "Processing…"; }

  try {
    const res = await Api.request(`/plans/${encodeURIComponent(planId)}/invest`, {
      method: "POST",
      body: JSON.stringify({ amount }),
    });

    if (okEl) {
      okEl.textContent = `Invested ${CURRENCY.fmt(res.amount)}. Matures ${new Date(res.matures_at).toLocaleDateString()}.`;
      okEl.style.display = "block";
    }
    if (amtEl) amtEl.value = "";

    await loadMyInvestments();
    if (typeof loadOverviewData === "function") loadOverviewData();

    setTimeout(() => {
      const form = document.querySelector(`[data-invest-form="${planId}"]`);
      const cta  = document.querySelector(`[data-invest-cta="${planId}"]`);
      if (form) form.style.display = "none";
      if (cta)  cta.style.display  = "";
      clearMsgs();
    }, 1800);
  } catch (err) {
    let msg = err.message || "Could not invest.";
    if (msg === "insufficient_balance") msg = "Insufficient balance. Fund your account first.";
    showErr(msg);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Confirm"; }
  }
}

   STOCK SEARCH
   ============================================================ */
async function smSearch(query) {
  const el = document.getElementById("sm-search-results");
  if (!el) return;

  const q = String(query || "").trim();

  // Empty box → don't call the API at all, just show a hint
  if (!q) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Type a symbol or company name (e.g. AAPL, Tesla, HSBC).</div>`;
    return;
  }

  try {
    // Use our own backend proxy — no third-party CORS proxy needed.
    const url = `/api/stock/search?q=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Server responded ${res.status}`);
    const ydata = await res.json();

    const results = (ydata.quotes || [])
      .filter(q => q.symbol && (q.quoteType === "EQUITY" || q.quoteType === "ETF" || q.quoteType === "INDEX"))
      .map(q => ({
        symbol: q.symbol,
        name: q.shortname || q.longname || q.symbol,
        exchange: q.exchange || q.exchDisp || "",
      }));

    if (!results.length) {
      el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No matches for "${escapeHtml(q)}".</div>`;
      return;
    }

    el.innerHTML = results.map(r => {
      const symbol = r.symbol;
      const logo   = stockLogoUrl(symbol, r.name);
      const avatar = assetAvatarHtml(symbol, logo, 52);

      return `
        <div class="tc-card" style="cursor:pointer;padding:14px;" data-pick="${escapeHtml(symbol)}">
          <div style="display:flex;align-items:center;gap:12px;">
            ${avatar}
            <div style="min-width:0;flex:1;">
              <div style="font-family:var(--mono);font-weight:700;color:var(--gold-bright);font-size:15px;line-height:1.2;">
                ${escapeHtml(symbol)}
              </div>
              ${r.name ? `<div style="font-size:11.5px;color:var(--text-dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                ${escapeHtml(r.name)}${r.exchange ? " · " + escapeHtml(r.exchange) : ""}
              </div>` : ""}
            </div>
          </div>
        </div>
      `;
    }).join("");

    el.querySelectorAll("[data-pick]").forEach(card => {
      card.addEventListener("click", () => smSelectSymbol(card.dataset.pick));
    });
  } catch (err) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Search unavailable: ${escapeHtml(err.message || "unknown error")}</div>`;
  }
}

};

/**
 * Returns the best-guess logo URL for a stock symbol.
 * Order: known domain map → DuckDuckGo icon proxy on a slugified name → null.
 */
function stockLogoUrl(symbol, name) {
  const sym = String(symbol || "").toUpperCase();
  const domain = STOCK_DOMAINS[sym];
  if (domain) {
    return `https://icons.duckduckgo.com/ip3/${domain}.ico`;
  }
  // Fall back to name-derived slug (e.g. "Tesla Inc" → "tesla")
  const slug = String(name || sym)
    .toLowerCase()
    .replace(/\b(inc|corp|corporation|co|company|ltd|limited|plc|group|holdings|sa|ag|nv|kk|class [a-z])\b\.?/g, "")
    .replace(/[^a-z0-9]/g, "");
  if (slug.length >= 3) {
    return `https://icons.duckduckgo.com/ip3/${slug}.com.ico`;
  }
  return null;
}


async function smDrawChart(symbol) {
  const loading = document.getElementById("sm-chart-loading");
  const canvas  = document.getElementById("sm-chart-canvas");
  if (!canvas) return;

  if (loading) {
    loading.style.display = "";
    loading.innerHTML = '<span class="loading-dots">Loading chart</span>';
  }
  canvas.style.display = "none";

  // Map the dashboard's timeframe codes to Yahoo's range+interval pairs
  const map = {
    "1Min":  { range: "1d",  interval: "1m"  },
    "5Min":  { range: "5d",  interval: "5m"  },
    "15Min": { range: "5d",  interval: "15m" },
    "1Day":  { range: "3mo", interval: "1d"  },
    "1Week": { range: "1y",  interval: "1wk" },
  };
  const { range, interval } = map[SM.timeframe] || map["1Day"];

  try {
    // Hit our own backend proxy — it forwards to Yahoo with a proper
    // User-Agent and returns the raw JSON. No CORS, no third-party proxy.
    const url = `/api/stock/chart/${encodeURIComponent(symbol)}?range=${range}&interval=${interval}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Server responded ${res.status}`);
    const data = await res.json();

    const result = data.chart.result[0];

    const timestamps = result.timestamp || [];
    const q = (result.indicators && result.indicators.quote && result.indicators.quote[0]) || {};

    const candles = timestamps.map((t, i) => ({
      open_time:  t * 1000,
      close_time: t * 1000,
      open:  q.open  ? q.open[i]  : null,
      high:  q.high  ? q.high[i]  : null,
      low:   q.low   ? q.low[i]   : null,
      close: q.close ? q.close[i] : null,
    })).filter(c => c.open != null && c.close != null && c.high != null && c.low != null);

    if (!candles.length) throw new Error("No candles returned");

    if (loading) loading.style.display = "none";
    canvas.style.display = "";
    paintCandles(canvas, candles);
  } catch (err) {
    if (loading) {
      loading.innerHTML = `<div class="empty-state">Chart unavailable: ${escapeHtml(err.message || "unknown error")}</div>`;
    }
  }
}

async function smSubmitOrder() {
  const errEl = document.getElementById("sm-order-error");
  const okEl  = document.getElementById("sm-order-success");
  if (errEl) errEl.style.display = "none";
  if (okEl)  okEl.style.display  = "none";
  const fail = (m) => { if (errEl) { errEl.textContent = m; errEl.style.display = "block"; } };

  if (!SM.symbol) return fail("Select a symbol first.");
  const qtyEl = document.getElementById("sm-qty");
  const qty = parseFloat((qtyEl && qtyEl.value) || 0);
  if (!qty || qty <= 0) return fail("Enter a quantity greater than zero.");

  const btn = document.getElementById("sm-submit");
  if (btn) { btn.disabled = true; btn.textContent = "Placing…"; }

  try {
    const res = await Api.request("/stock/order", {
      method: "POST",
      body: JSON.stringify({
        symbol: SM.symbol,
        side: SM.side,      // 'BUY' | 'SELL'
        qty: qty,
      }),
    });

    if (okEl) {
      const order = (res && res.order) || {};
      okEl.textContent =
        `${SM.side} order submitted for ${qty} ${SM.symbol}` +
        (order.status ? ` — ${order.status}` : "") +
        (order.id ? ` (id: ${order.id})` : "");
      okEl.style.display = "block";
    }

    if (qtyEl) qtyEl.value = "";

    // Refresh everything that changed
    await smLoadPositions();
    await smLoadOrders();

    // Keep the sidebar/right-rail balances in sync
    if (typeof loadOverviewData === "function") loadOverviewData();
  } catch (err) {
    fail(err.message || "Could not place order.");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Place order"; }
  }

  async function loadPortfolioSection() {
    const valEl   = document.getElementById("pf-value");
    const costEl  = document.getElementById("pf-cost");
    const plEl    = document.getElementById("pf-pl");
    const pctEl   = document.getElementById("pf-pl-pct");
    const assetEl = document.getElementById("pf-assets");
    const countEl = document.getElementById("pf-count");
    const tableEl = document.getElementById("pf-holdings-table");

    // Only run if the merged section is on the page
    if (!valEl) return;

    try {
      const data = await Api.request("/portfolio");
      if (!data || data.status === "no_account") {
        [valEl, costEl, plEl].forEach(e => e && (e.textContent = CURRENCY.fmt(0)));
        if (assetEl) assetEl.textContent = "0";
        if (countEl) countEl.textContent = "0 positions";
        if (tableEl) tableEl.innerHTML = `<div class="empty-state">No brokerage account yet. <a href="/kyc.html">Complete KYC</a>.</div>`;
        if (typeof renderPortfolio3D === "function") renderPortfolio3D("portfolio-canvas", []);
        state.lastPositions = [];
        return;
      }

      const positions = data.positions || [];
      state.lastPositions = positions;

      const totalValue = positions.reduce((s, p) => s + parseFloat(p.market_value || 0), 0);
      const totalPL    = positions.reduce((s, p) => s + parseFloat(p.unrealized_pl || 0), 0);
      const totalCost  = totalValue - totalPL;
      const growthPct  = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;

      if (valEl)   valEl.textContent   = CURRENCY.fmt(totalValue);
      if (costEl)  costEl.textContent  = CURRENCY.fmt(totalCost);
      if (plEl) {
        plEl.textContent = CURRENCY.fmtSigned(totalPL);
        plEl.className = "kpi-value " + (totalPL > 0 ? "up" : totalPL < 0 ? "down" : "");
      }
      if (pctEl) {
        pctEl.innerHTML = `<span class="trend ${growthPct >= 0 ? "up" : "down"}">${growthPct >= 0 ? "+" : ""}${growthPct.toFixed(2)}%</span> vs cost basis`;
      }
      if (assetEl) assetEl.textContent = positions.length;
      if (countEl) countEl.textContent = positions.length + " position" + (positions.length === 1 ? "" : "s");

      if (typeof renderPortfolio3D === "function") {
        renderPortfolio3D("portfolio-canvas", positions);

      if (!positions.length) {
        if (tableEl) tableEl.innerHTML = `<div class="empty-state">No open positions yet.</div>`;
        return;

      const rows = positions.map(p => {
        const pl = parseFloat(p.unrealized_pl || 0);
        return `<tr>
          <td class="sym">${escapeHtml(p.symbol)}</td>
          <td class="mono">${parseFloat(p.qty).toLocaleString(undefined, { maximumFractionDigits: 4 })}</td>
          <td class="mono">${CURRENCY.fmt(p.market_value)}</td>
          <td class="${pl > 0 ? "up" : pl < 0 ? "down" : "mono"}">${CURRENCY.fmtSigned(pl)}</td>
        </tr>`;
      }).join("");

      if (tableEl) {
        tableEl.innerHTML = `<table class="holdings-table">
          <thead><tr><th>Symbol</th><th>Qty</th><th>Value</th><th>Unrealized P/L</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      }
    } catch (err) {
      if (tableEl) tableEl.innerHTML = `<div class="empty-state">Could not load: ${escapeHtml(err.message)}</div>`;
    }
  }

  function renderWallets() {
    const grid = document.getElementById("wallet-grid");
    if (!grid) return;

    const linkedIds = new Set(state.wallets.map(w => w.wallet_id));
    let visible = WALLETS.filter(w => {
      if (walletFilter === "popular" && w.type !== "popular") return false;
       if (walletFilter === "solana" && w.chain !== "Solana") return false;
      if (walletFilter === "hardware" && w.type !== "hardware") return false;
      if (walletFilter === "linked" && !linkedIds.has(w.id)) return false;
      if (walletSearch && !w.name.toLowerCase().includes(walletSearch) && !w.chain.toLowerCase().includes(walletSearch)) return false;
      return true;
    });

    const countEl = document.getElementById("wallet-visible-count");
    if (countEl) countEl.textContent = visible.length + " wallet" + (visible.length === 1 ? "" : "s");

    if (!visible.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">No wallets match your filter.</div>`;

  async function loadPortfolioPage() {
    const valEl = document.getElementById("pf-value");
    const costEl = document.getElementById("pf-cost");
    const plEl = document.getElementById("pf-pl");
    const pctEl = document.getElementById("pf-pl-pct");
    const assetEl = document.getElementById("pf-assets");
    const countEl = document.getElementById("pf-count");
    const tableEl = document.getElementById("pf-holdings-table");

    try {
      const data = await Api.request("/portfolio");
      if (!data || data.status === "no_account") {
        [valEl, costEl, plEl].forEach(e => e && (e.textContent = "$0.00"));
        if (assetEl) assetEl.textContent = "0";
        if (countEl) countEl.textContent = "0 positions";
        if (tableEl) tableEl.innerHTML = `<div class="empty-state">No brokerage account yet. <a href="/kyc.html">Complete KYC</a>.</div>`;
        if (typeof renderPortfolio3D === "function") renderPortfolio3D("portfolio-canvas", []);
        return;
      }
      const positions = data.positions || [];
      const totalValue = positions.reduce((s, p) => s + parseFloat(p.market_value || 0), 0);
      const totalPL    = positions.reduce((s, p) => s + parseFloat(p.unrealized_pl || 0), 0);
      const totalCost  = totalValue - totalPL;
      const growthPct  = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;

      if (valEl) valEl.textContent = CURRENCY.fmt(totalValue);
      if (costEl) costEl.textContent = CURRENCY.fmt(totalCost);
      if (plEl) {
        plEl.textContent = CURRENCY.fmtSigned(totalPL);
        plEl.className = "kpi-value " + (totalPL > 0 ? "up" : totalPL < 0 ? "down" : "");
      }
      if (pctEl) pctEl.innerHTML = `<span class="trend ${growthPct >= 0 ? "up" : "down"}">${growthPct >= 0 ? "+" : ""}${growthPct.toFixed(2)}%</span> vs cost basis`;
      if (assetEl) assetEl.textContent = positions.length;
      if (countEl) countEl.textContent = positions.length + " position" + (positions.length === 1 ? "" : "s");

      if (typeof renderPortfolio3D === "function") renderPortfolio3D("portfolio-canvas", positions);

      if (!positions.length) {
        if (tableEl) tableEl.innerHTML = `<div class="empty-state">No open positions yet.</div>`;
        return;
      }

      const rows = positions.map(p => {
        const pl = parseFloat(p.unrealized_pl || 0);
        return `<tr>
          <td class="sym">${escapeHtml(p.symbol)}</td>
          <td class="mono">${parseFloat(p.qty).toLocaleString(undefined, { maximumFractionDigits: 4 })}</td>
          <td class="mono">${CURRENCY.fmt(p.market_value)}</td>
          <td class="${pl > 0 ? "up" : pl < 0 ? "down" : "mono"}">${CURRENCY.fmtSigned(pl)}</td>
        </tr>`;
      }).join("");

      if (tableEl) tableEl.innerHTML = `<table class="holdings-table">
        <thead><tr><th>Symbol</th><th>Qty</th><th>Value</th><th>Unrealized P/L</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    } catch (err) {
      if (tableEl) tableEl.innerHTML = `<div class="empty-state">Could not load: ${escapeHtml(err.message)}</div>`;
    }
  }

    if (c === "USDT") return "₮";

        // Wire the file input preview
    if (proofInput && !proofInput.dataset.wired) {

  async function submitFundRequest() {
    const backdrop = fundModalBackdrop;
    if (!backdrop) return;

    const isBank = backdrop._method === "bank";
    const crypto = backdrop._crypto;

    if (!isBank && !crypto) return;

    const errEl = document.getElementById("fm-error");
    const okEl  = document.getElementById("fm-success");
    errEl.style.display = "none";
    okEl.style.display  = "none";

    const usd = parseFloat(document.getElementById("fm-amount").value || 0);
    const proofInput = document.getElementById("fm-proof");
    const proofFile = proofInput && proofInput.files ? proofInput.files[0] : null;

    const fail = (msg) => { errEl.textContent = msg; errEl.style.display = "block"; };

    if (!usd || usd <= 0) return fail("Enter the USD amount you're sending.");
    if (!proofFile) return fail("Attach a screenshot or photo of your payment.");

    const btn = document.getElementById("fm-submit");
    btn.disabled = true;
    btn.textContent = "Submitting…";

    try {
      const form = new FormData();
      form.append("amount", usd);
      form.append("proof", proofFile);

      if (isBank) {
        form.append("method", "bank");
        form.append("method_ref", backdrop._bank?.bank_name || "");
        form.append("reference", "");
      } else {
        form.append("method", "crypto");
        form.append("method_ref", crypto.id || crypto.coin);
        form.append("reference", "");
      }

      await Api.request("/topups", { method: "POST", body: form, headers: {} });

      okEl.textContent = "Request submitted. An administrator will confirm your transfer shortly.";
      okEl.style.display = "block";

      document.getElementById("fm-amount").value = "";
      document.getElementById("fm-crypto-amount").textContent = "—";
      if (proofInput) proofInput.value = "";
      const preview = document.getElementById("fm-proof-preview");
      if (preview) preview.style.display = "none";
      document.getElementById("fm-reveal-section").style.display = "none";

      setTimeout(() => closeFundModal(), 1400);
    } catch (err) {
      fail(err.message || "Could not submit.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit proof of payment";
    }
  }

    /* ---------- Withdraw page: three-state machine ---------- */
  let WD_POLL = null;

  async function bindWithdraw() {
    // Clean up any previous poll when navigating to this page
    if (WD_POLL) { clearInterval(WD_POLL); WD_POLL = null; }

    // Refresh the wallet list first so hasStoredWallet is accurate
    // if the user just linked a wallet on the previous page.
    try { await loadWallets(); } catch (_) {}

    showWithdrawLoading();
    loadWithdrawState();

    // Also sync the sidebar / rail / topbar balance immediately
    loadOverviewData();

    // Re-check every 10 seconds so the state auto-flips when the admin approves
    WD_POLL = setInterval(() => {
      if (state.page !== "withdraw") {
        clearInterval(WD_POLL);
        WD_POLL = null;
        return;
      }
      loadWithdrawState();
    }, 10000);
  }

  function showWithdrawLinkWalletModal() {
