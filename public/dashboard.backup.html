<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Wall Street Capital</title>
<script>
  (function(){
    var t = localStorage.getItem("wsc_theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="/css/styles.css">
<style>
  .dash-app {
    display: grid;
    grid-template-columns: 250px 1fr 320px;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  @media (max-width: 1200px) {
    .dash-app { grid-template-columns: 250px 1fr; }
    .dash-rail { display: none !important; }
  }
  @media (max-width: 900px) {
    .dash-app { grid-template-columns: 1fr; }
  }

  .dash-sidebar {
    background: rgba(8, 15, 32, 0.85);
    border-right: 1px solid var(--line-soft);
    backdrop-filter: blur(24px);
    padding: 22px 14px 40px;
    position: sticky; top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  html[data-theme="light"] .dash-sidebar { background: rgba(240, 244, 251, 0.85); }
  .dash-sidebar::-webkit-scrollbar { width: 5px; }
  .dash-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  @media (max-width: 900px) {
    .dash-sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: 260px;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 60; height: 100dvh;
    }
    .dash-sidebar.open { transform: translateX(0); }
  }

  .sb-brand {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 20px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 18px;
    text-decoration: none;
  }
  .sb-brand .logo {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #3B82F6, #1D4ED8);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; font-weight: 700; font-size: 13px;
    flex-shrink: 0;
  }
  .sb-brand .mark {
    font-family: var(--serif); font-size: 17px;
    color: var(--text);
  }
  .sb-brand .mark em { font-style: normal; color: var(--gold-bright); }

  .sb-user {
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 12px 16px;
    background: rgba(0, 8, 24, 0.4);
    border: 1px solid var(--line-soft);
    border-radius: 14px;
    margin-bottom: 20px;
    text-align: center;
  }
  html[data-theme="light"] .sb-user { background: rgba(255,255,255,0.6); }
  .sb-avatar {
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, #22D3EE, #0891B2);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; font-family: var(--serif);
    font-size: 20px; font-weight: 500;
    margin-bottom: 10px;
    position: relative;
  }
  .sb-avatar::after {
    content: "";
    position: absolute; bottom: 2px; right: 2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--tick-up);
    border: 2px solid var(--bg);
  }
  .sb-user .name {
    font-family: var(--serif); font-size: 14.5px;
    color: var(--text); margin-bottom: 2px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sb-user .status {
    font-size: 11px; color: var(--tick-up);
    margin-bottom: 10px;
  }
  .sb-balance {
    display: flex; flex-direction: column; gap: 2px;
    width: 100%; padding: 10px 12px;
    border-radius: 10px;
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(96, 165, 250, 0.2);
    text-align: left;
  }
  .sb-balance .label {
    font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dimmer);
  }
  .sb-balance .amount {
    font-family: var(--mono); font-size: 15px;
    color: var(--gold-bright);
  }

  .sb-group { margin-bottom: 16px; }
  .sb-group-title {
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dimmer);
    padding: 6px 12px; margin-bottom: 4px;
    font-weight: 600;
  }
  .sb-link {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 13px;
    color: var(--text-dim);
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 1px;
    cursor: pointer;
    position: relative;
  }
  .sb-link:hover {
    background: rgba(59, 130, 246, 0.08);
    color: var(--text);
  }
  .sb-link.active {
    background: rgba(59, 130, 246, 0.14);
    color: var(--text);
    box-shadow: inset 3px 0 0 var(--gold);
  }
  .sb-link svg {
    width: 15px; height: 15px;
    flex-shrink: 0;
    color: var(--text-dimmer);
    transition: color 0.15s;
  }
  .sb-link:hover svg, .sb-link.active svg { color: var(--gold-bright); }
  .sb-link .badge-live {
    margin-left: auto; font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 8px;
    background: rgba(74, 222, 128, 0.15);
    color: var(--tick-up);
    border: 1px solid rgba(74, 222, 128, 0.35);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sb-link .badge-premium {
    margin-left: auto; font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 8px;
    background: linear-gradient(135deg, #FBBF24, #B45309);
    color: #FFFFFF;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sb-link .badge-soon {
    margin-left: auto; font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 8px;
    background: rgba(96, 165, 250, 0.12);
    color: var(--gold-bright);
    border: 1px solid rgba(96, 165, 250, 0.3);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sb-link .caret {
    width: 12px; height: 12px;
    margin-left: auto;
    transition: transform 0.25s;
    color: var(--text-dimmer);
    flex-shrink: 0;
  }
  .sb-link.expanded .caret { transform: rotate(90deg); color: var(--gold-bright); }

  .sb-sub {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    padding-left: 14px;
    border-left: 1px solid var(--line-soft);
    margin-left: 18px;
  }
  .sb-sub.open { max-height: 300px; }
  .sb-sub-link {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 1px;
  }
  .sb-sub-link:hover { background: rgba(59, 130, 246, 0.08); color: var(--text); }
  .sb-sub-link.active { color: var(--gold-bright); background: rgba(59, 130, 246, 0.1); }
  .sb-sub-link svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--text-dimmer); }
  .sb-sub-link:hover svg, .sb-sub-link.active svg { color: var(--gold-bright); }

  .dash-main { display: flex; flex-direction: column; min-width: 0; }

  .dash-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(5, 11, 24, 0.75);
    backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 20;
  }
  html[data-theme="light"] .dash-topbar { background: rgba(240, 244, 251, 0.85); }

  .tb-left { display: flex; align-items: center; gap: 14px; }
  .tb-burger {
    display: none; width: 36px; height: 36px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text-dim);
    cursor: pointer; align-items: center; justify-content: center;
  }
  @media (max-width: 900px) { .tb-burger { display: flex; } }
  .tb-burger svg { width: 18px; height: 18px; }

  .tb-title-block { display: flex; flex-direction: column; gap: 1px; }
  .tb-eyebrow {
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dimmer);
    font-weight: 600;
  }
  .tb-title {
    font-family: var(--serif); font-size: 15.5px;
    color: var(--text); font-weight: 500;
  }

  .tb-right { display: flex; align-items: center; gap: 12px; }
  .tb-verified {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px;
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid rgba(74, 222, 128, 0.35);
    color: var(--tick-up);
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .tb-verified svg { width: 11px; height: 11px; }

  .tb-icon-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; position: relative;
  }
  .tb-icon-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
  .tb-icon-btn svg { width: 15px; height: 15px; }
  .tb-icon-btn .dot {
    position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--tick-down);
    border: 1.5px solid var(--bg);
  }

  .tb-user-chip {
    display: flex; align-items: center; gap: 9px;
    padding: 4px 11px 4px 4px;
    border-radius: 22px;
    border: 1px solid var(--line);
    background: var(--panel);
    cursor: pointer; transition: all 0.2s;
    max-width: 260px;
  }
  .tb-user-chip:hover { border-color: var(--gold); }
  .tb-user-chip .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #22D3EE, #0891B2);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; font-weight: 600; font-size: 10.5px;
    font-family: var(--serif);
    flex-shrink: 0;
  }
  .tb-user-chip .meta { display: flex; flex-direction: column; min-width: 0; }
  .tb-user-chip .name {
    font-size: 12.5px; color: var(--text); line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tb-user-chip .role {
    font-size: 10px; color: var(--text-dimmer); line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @media (max-width: 700px) {
    .tb-verified { display: none; }
    .tb-user-chip .meta { display: none; }
  }

  .dash-content {
    padding: 24px 26px 50px;
    max-width: 1200px;
    width: 100%;
  }
  @media (max-width: 700px) { .dash-content { padding: 18px; } }

  .page { display: none; }
  .page.active { display: block; animation: pageIn 0.35s ease-out; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dash-greeting {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 20px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .dash-greeting h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(22px, 3vw, 28px);
    margin: 0 0 6px; color: var(--text);
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap;
  }
  .badge-active {
    font-family: var(--sans);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--tick-up); padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(74, 222, 128, 0.35);
    background: rgba(74, 222, 128, 0.08);
  }
  .dash-greeting .date {
    font-size: 12.5px; color: var(--text-dimmer);
    display: flex; align-items: center; gap: 8px;
  }
  .dash-greeting .date svg { width: 13px; height: 13px; }
  .dash-greeting .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 800px) { .quick-actions { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { .quick-actions { grid-template-columns: 1fr; } }

  .qa-tile {
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    cursor: pointer;
    transition: all 0.25s;
    text-decoration: none;
  }
  .qa-tile:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.25),
                0 18px 36px rgba(59, 130, 246, 0.2);
  }
  .qa-icon {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    color: #FFFFFF;
  }
  .qa-icon svg { width: 22px; height: 22px; }
  .qa-tile.deposit .qa-icon  { background: linear-gradient(135deg, #4ADE80, #15803D); }
  .qa-tile.withdraw .qa-icon { background: linear-gradient(135deg, #60A5FA, #1D4ED8); }
  .qa-tile.trade .qa-icon    { background: linear-gradient(135deg, #C084FC, #7E22CE); }
  .qa-tile.invest .qa-icon   { background: linear-gradient(135deg, #FBBF24, #B45309); }
  .qa-label {
    font-family: var(--serif); font-size: 15px;
    color: var(--text); font-weight: 500;
    margin-bottom: 3px;
  }
  .qa-sub { font-size: 11.5px; color: var(--text-dimmer); }

  .link-wallet-card {
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.12) 0%, rgba(15, 26, 48, 0.9) 55%, rgba(5, 11, 24, 0.9) 100%);
    border: 1px solid rgba(96, 165, 250, 0.28);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(20px);
  }
  html[data-theme="light"] .link-wallet-card {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(255, 255, 255, 0.9) 55%, rgba(240, 244, 251, 0.95) 100%);
  }
  .link-wallet-card::before {
    content: "";
    position: absolute; top: -40%; right: -20%;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.3), transparent 65%);
    filter: blur(40px); pointer-events: none;
  }
  .link-wallet-card .lwc-icon {
    width: 60px; height: 60px; border-radius: 16px;
    background: linear-gradient(135deg, #60A5FA, #1D4ED8);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; margin: 0 auto 18px;
    box-shadow: 0 12px 28px rgba(59, 130, 246, 0.4);
    position: relative; z-index: 1;
  }
  .link-wallet-card .lwc-icon svg { width: 26px; height: 26px; }
  .link-wallet-card h3 {
    font-family: var(--serif); font-size: 22px;
    font-weight: 500; margin: 0 0 10px;
    color: var(--text);
    position: relative; z-index: 1;
  }
  .link-wallet-card p {
    font-size: 14px; color: var(--text-dim);
    max-width: 52ch; margin: 0 auto 22px;
    line-height: 1.65;
    position: relative; z-index: 1;
  }
  .link-wallet-card .btn {
    position: relative; z-index: 1;
    padding: 13px 28px;
    font-size: 14px;
  }

  .market-overview-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(20px);
    margin-bottom: 20px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .market-overview-card:hover {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.22), 0 18px 40px rgba(59, 130, 246, 0.18);
  }
  .market-overview-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
    gap: 12px; flex-wrap: wrap;
  }
  .market-overview-head h3 {
    font-family: var(--serif); font-size: 16.5px;
    font-weight: 500; margin: 0; color: var(--text);
  }
  .market-overview-head a {
    font-size: 12px; color: var(--gold-bright);
    text-decoration: none;
    cursor: pointer;
  }
  .market-overview-head a:hover { text-decoration: underline; }

  .crypto-chips {
    display: flex; gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .crypto-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-radius: 20px;
    background: rgba(0, 8, 24, 0.5);
    border: 1px solid var(--line);
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
  }
  html[data-theme="light"] .crypto-chip { background: rgba(255,255,255,0.7); }
  .crypto-chip:hover, .crypto-chip.active {
    border-color: var(--gold);
    background: rgba(59, 130, 246, 0.1);
    color: var(--text);
  }
  .crypto-chip .sym {
    font-family: var(--mono); font-weight: 600;
    color: var(--text);
  }
  .crypto-chip .chg {
    font-family: var(--mono); font-weight: 600;
    font-size: 11.5px;
  }
  .crypto-chip .chg.up { color: var(--tick-up); }
  .crypto-chip .chg.down { color: var(--tick-down); }

  .tv-market-box {
    color-scheme: light;
    width: 100%;
    height: 420px;
    border-radius: 12px;
    overflow: hidden;
    background: transparent;
  }
  @media (max-width: 700px) { .tv-market-box { height: 340px; } }
  .tv-market-box .tradingview-widget-container { width: 100%; height: 100%; }
  .tv-market-box .tradingview-widget-container__widget { width: 100%; height: 100%; }

  .row-2 {
    display: grid; grid-template-columns: 1.3fr 1fr;
    gap: 18px; margin-bottom: 20px;
  }
  @media (max-width: 1000px) { .row-2 { grid-template-columns: 1fr; } }

  .kpi-strip {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-bottom: 20px;
  }
  @media (max-width: 1000px) { .kpi-strip { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 500px)  { .kpi-strip { grid-template-columns: 1fr; } }

  .kpi {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 16px 18px;
    backdrop-filter: blur(20px);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .kpi:hover {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.22), 0 14px 30px rgba(59, 130, 246, 0.16);
  }
  .kpi .kpi-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .kpi .kpi-label {
    font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dimmer);
    font-weight: 600;
  }
  .kpi .kpi-ico {
    width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .kpi .kpi-ico svg { width: 13px; height: 13px; color: #FFFFFF; }
  .kpi .kpi-ico.green { background: linear-gradient(135deg, #4ADE80, #15803D); }
  .kpi .kpi-ico.blue  { background: linear-gradient(135deg, #60A5FA, #1D4ED8); }
  .kpi .kpi-ico.rose  { background: linear-gradient(135deg, #FB7185, #BE123C); }
  .kpi .kpi-ico.amber { background: linear-gradient(135deg, #FBBF24, #B45309); }
  .kpi .kpi-ico.cyan  { background: linear-gradient(135deg, #22D3EE, #0E7490); }
  .kpi .kpi-value {
    font-family: var(--mono); font-size: 20px;
    color: var(--text); line-height: 1.1;
    margin-bottom: 4px;
  }
  .kpi .kpi-value.up { color: var(--tick-up); }
  .kpi .kpi-value.down { color: var(--tick-down); }
  .kpi .kpi-sub { font-size: 11px; color: var(--text-dimmer); }
  .kpi .kpi-sub a { color: var(--gold-bright); text-decoration: none; }
  .kpi .kpi-sub a:hover { text-decoration: underline; }
  .trend.up { color: var(--tick-up); font-weight: 600; }
  .trend.down { color: var(--tick-down); font-weight: 600; }

  .balance-card {
    background: linear-gradient(135deg,
      rgba(37, 99, 235, 0.18) 0%,
      rgba(15, 26, 48, 0.9) 55%,
      rgba(5, 11, 24, 0.9) 100%);
    border: 1px solid rgba(96, 165, 250, 0.3);
    border-radius: 18px;
    padding: 28px 26px;
    position: relative; overflow: hidden;
    backdrop-filter: blur(24px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  }
  html[data-theme="light"] .balance-card {
    background: linear-gradient(135deg,
      rgba(59, 130, 246, 0.14) 0%,
      rgba(255, 255, 255, 0.9) 55%,
      rgba(240, 244, 251, 0.95) 100%);
  }
  .balance-card::before {
    content: "";
    position: absolute; top: -40%; right: -20%;

    background: radial-gradient(circle, rgba(96, 165, 250, 0.4), transparent 65%);

  .balance-card .bc-eye {

  .balance-card .bc-eye:hover { color: var(--gold-bright); border-color: var(--gold); }

  .balance-card .bc-label {

  .balance-card .bc-amount {

  .balance-card .bc-available {

  .balance-card .bc-actions {

  .stat-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .stat-tile {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 16px;
    backdrop-filter: blur(20px);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;

    border-color: var(--gold);

  .stat-tile .st-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .stat-tile .st-icon {
    width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .stat-tile .st-icon svg { width: 13px; height: 13px; color: #FFFFFF; }
  .stat-tile .st-icon.green { background: linear-gradient(135deg, #4ADE80, #15803D); }
  .stat-tile .st-icon.blue  { background: linear-gradient(135deg, #60A5FA, #1D4ED8); }
  .stat-tile .st-icon.rose  { background: linear-gradient(135deg, #FB7185, #BE123C); }
  .stat-tile .st-icon.amber { background: linear-gradient(135deg, #FBBF24, #B45309); }
  .stat-tile .st-icon.purple{ background: linear-gradient(135deg, #C084FC, #7E22CE); }
  .stat-tile .st-label {
    font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dimmer);
    font-weight: 600; margin-bottom: 4px;
  }
  .stat-tile .st-value {
    font-family: var(--mono); font-size: 19px;
    color: var(--text); line-height: 1.15;
  }
  .stat-tile .st-value.up { color: var(--tick-up); }
  .stat-tile .st-value.down { color: var(--tick-down); }
  .stat-tile .st-sub { font-size: 11px; color: var(--text-dimmer); margin-top: 4px; }
  .stat-tile .st-sub a { color: var(--gold-bright); text-decoration: none; }

  .section-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    backdrop-filter: blur(20px);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    margin-bottom: 20px;
  }
  .section-card:hover {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.22), 0 18px 40px rgba(59, 130, 246, 0.18);
  }
  .section-card .sc-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; padding-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
    gap: 12px; flex-wrap: wrap;
  }
  .section-card .sc-head h3 {
    font-family: var(--serif); font-size: 16.5px;
    font-weight: 500; margin: 0; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .section-card .sc-head h3 .pill {
    font-family: var(--sans);
    font-size: 10px; padding: 3px 9px;
    border-radius: 20px;
    background: rgba(59, 130, 246, 0.1);
    color: var(--gold-bright);
    border: 1px solid rgba(96, 165, 250, 0.3);
    letter-spacing: 0.06em; font-weight: 600;
    text-transform: uppercase;
  }
  .section-card .sc-head a {
    font-size: 12px; color: var(--gold-bright);
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .section-card .sc-head a:hover { text-decoration: underline; }
  .section-card .sc-head a svg { width: 11px; height: 11px; }

  /* ============================================================
   COPY TRADING — trader cards
   ============================================================ */

.tc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
@media (max-width: 1100px) { .tc-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px)  { .tc-grid { grid-template-columns: 1fr; } }

/* ---------- Card shell ---------- */
.tc-card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 18px 16px;
  backdrop-filter: blur(20px);
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
html[data-theme="light"] .tc-card { background: rgba(255,255,255,0.75); }

.tc-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.25),
              0 18px 36px rgba(59, 130, 246, 0.2);
}
/* ============================================================
   COPY TRADE PAYMENT MODAL
   ============================================================ */
.copy-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.copy-modal-backdrop.open { display: flex; }

.copy-modal {
  width: 100%;
  max-width: 460px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  backdrop-filter: blur(28px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  max-height: 92vh;
  overflow-y: auto;
  animation: cmIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
}
html[data-theme="light"] .copy-modal { background: #FFFFFF; }

@keyframes cmIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.cm-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 14px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line-soft);
}
.cm-head h3 {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  margin: 0;
  color: var(--text);
}
.cm-close {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cm-close:hover { color: var(--gold-bright); border-color: var(--gold); }
.cm-close svg { width: 14px; height: 14px; }

/* Trader identity strip */
.cm-trader {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(59, 130, 246, 0.06);
  border: 1px solid rgba(96, 165, 250, 0.2);
  margin-bottom: 18px;
}
.cm-trader-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #60A5FA, #1D4ED8);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--serif); font-size: 16px;
  overflow: hidden; flex-shrink: 0;
}
.cm-trader-avatar img { width: 100%; height: 100%; object-fit: cover; }
.cm-trader-name {
  font-family: var(--serif); font-size: 15px;
  color: var(--text); font-weight: 500;
}
.cm-trader-sub {
  font-size: 11.5px;
  color: var(--text-dimmer);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Field wrappers */
.cm-field { margin-bottom: 16px; }
.cm-field label {
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 500;
  margin-bottom: 7px;
}
.cm-field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  background: rgba(0, 8, 24, 0.5);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
}
html[data-theme="light"] .cm-field input { background: rgba(255,255,255,0.8); }
.cm-field input:focus {
  outline: none;
  border-color: rgba(96, 165, 250, 0.65);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
}
.cm-hint {
  font-size: 11px;
  color: var(--text-dimmer);
  margin-top: 5px;
}

/* Source selector */
.cm-sources {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 420px) { .cm-sources { grid-template-columns: 1fr; } }

.cm-source {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(0, 8, 24, 0.4);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: var(--sans);
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
}
html[data-theme="light"] .cm-source { background: rgba(255,255,255,0.7); }

.cm-source svg {
  width: 18px; height: 18px;
  color: var(--text-dimmer);
  flex-shrink: 0;
}
.cm-source:hover { border-color: var(--gold); }
.cm-source.active {
  border-color: var(--gold);
  background: rgba(59, 130, 246, 0.12);
}
.cm-source.active svg { color: var(--gold-bright); }

.cm-src-name { font-size: 13px; font-weight: 600; }
.cm-src-sub {
  font-size: 11px;
  color: var(--text-dimmer);
  margin-top: 2px;
  font-family: var(--mono);
}

/* Error box */
.cm-error {
  display: none;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid rgba(248, 113, 113, 0.35);
  color: var(--tick-down);
  font-size: 12.5px;
  margin-bottom: 14px;
}

/* Footer buttons */
.cm-actions {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}
.cm-actions .btn { flex: 1; padding: 13px; font-size: 13.5px; }
.cm-actions .btn-solid { font-weight: 700; }
/* ---------- Top row (status pill) ---------- */
.tc-top {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 6px;
}
.tc-status {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 12px;
  color: var(--tick-up);
  background: rgba(74, 222, 128, 0.12);
  border: 1px solid rgba(74, 222, 128, 0.35);
}

/* ---------- Avatar / identity block ---------- */
.tc-avatar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-bottom: 14px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--line-soft);
}

.tc-avatar-lg {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #60A5FA, #1D4ED8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  overflow: hidden;
  flex-shrink: 0;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(59, 130, 246, 0.32);
}
.tc-avatar-lg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.tc-name-lg {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.25;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 4px;
}

.tc-tier {
  display: inline-block;
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 12px;
  color: #C084FC;
  background: rgba(192, 132, 252, 0.12);
  border: 1px solid rgba(192, 132, 252, 0.35);
  margin-bottom: 8px;
}

.tc-stars {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 5px;
  font-size: 13px;
  line-height: 1;
}
.tc-stars .star { color: var(--text-dimmer); }
.tc-stars .star.filled { color: #FBBF24; }
.tc-stars .star.empty { color: rgba(251, 191, 36, 0.2); }
.tc-stars .reviews {
  font-size: 11px;
  color: var(--text-dimmer);
  margin-left: 5px;
  font-family: var(--mono);
}

.tc-followers {
  font-size: 11px;
  color: var(--text-dimmer);
  letter-spacing: 0.02em;
}

/* ---------- Stats row ---------- */
.tc-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.tc-stat {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  padding: 9px 6px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
html[data-theme="light"] .tc-stat { background: rgba(0,0,0,0.03); }

.tc-stat .value {
  font-family: var(--mono);
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.15;
}
.tc-stat .value.up { color: var(--tick-up); }
.tc-stat .value.down { color: var(--tick-down); }

.tc-stat .label {
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  font-weight: 600;
}

/* Progress bar for win-rate */
.tc-stat .bar {
  height: 3px;
  width: 100%;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  margin-top: 4px;
  overflow: hidden;
}
.tc-stat .bar .fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #4ADE80, #15803D);
  transition: width 0.4s ease;
}

/* ---------- Minimum investment row ---------- */
.tc-min {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(59, 130, 246, 0.06);
  border: 1px solid rgba(96, 165, 250, 0.2);
  margin-bottom: 12px;
}
.tc-min .label {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  font-weight: 600;
}
.tc-min .value {
  font-family: var(--mono);
  font-size: 13.5px;
  color: var(--gold-bright);
  font-weight: 600;
}

/* ---------- Action button ---------- */
.tc-action { margin-top: auto; }

.tc-action button {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #FFFFFF;
  background: linear-gradient(135deg, #4ADE80, #15803D);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  box-shadow: 0 6px 18px rgba(74, 222, 128, 0.3);
}
.tc-action button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(74, 222, 128, 0.45);
}
.tc-action button:disabled {
  cursor: not-allowed;
  opacity: 0.7;
  transform: none;
  box-shadow: none;
  background: linear-gradient(135deg, rgba(74, 222, 128, 0.35), rgba(21, 128, 61, 0.35));
}
.tc-action button svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

/* Stop-copying variant (used on "My copies" tab) */
.tc-action button.stop {
  background: linear-gradient(135deg, #FB7185, #BE123C);
  box-shadow: 0 6px 18px rgba(248, 113, 113, 0.3);
}
.tc-action button.stop:hover:not(:disabled) {
  box-shadow: 0 8px 24px rgba(248, 113, 113, 0.45);
}

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  function initials(str) {
    if (!str) return "U";
    const p = String(str).trim().split(/\s+/);
    if (p.length >= 2) return (p[0][0] + p[1][0]).toUpperCase();
    return p[0].slice(0, 2).toUpperCase();
  }
  function iconSvg(name) {

  async loadBalance() {
    const sub = document.getElementById("cm-bal-sub");
    try {
      const data = await Api.request("/portfolio");
      const acct = data.account || {};
      // Prefer an explicit cash balance if the API returns one
      const bal = parseFloat(
        acct.available_balance ??
        acct.cash_balance ??
        acct.balance ??
        acct.portfolio_value ??
        0
      );
      this.availableBalance = bal;
      sub.textContent = "Available: " + fmtMoney(bal);
    } catch (err) {
      sub.textContent = "Available: —";
    }
  },

  async submit() {
    const amount = parseFloat(this.amountEl.value);
    const min = parseFloat(this.trader.minimum_investment || 0);
    const errEl = this.errorEl;

    const fail = (msg) => {
      errEl.textContent = msg;
      errEl.style.display = "block";
    };
    errEl.style.display = "none";

    if (!amount || amount <= 0) return fail("Enter a valid amount.");
    if (amount < min) return fail("Amount must be at least $" + min.toFixed(2) + ".");

    if (this.source === "balance" && amount > this.availableBalance) {
      return fail("Insufficient balance. You have " + fmtMoney(this.availableBalance) + ".");
    }

    this.confirmBtn.disabled = true;
    this.confirmBtn.textContent = "Processing…";

    try {
      let walletInfo = null;

      if (this.source === "wallet") {
        walletInfo = await this.connectWalletForPayment();
        if (!walletInfo) {
          this.confirmBtn.disabled = false;
          this.confirmBtn.textContent = "Confirm & start";
          return; // user cancelled
        }
      }

      const payload = {
        amount: amount,
        source: this.source,
      };
      if (walletInfo) {
        payload.wallet_id = walletInfo.wallet_id;
        payload.wallet_address = walletInfo.address;
        payload.tx_hash = walletInfo.tx_hash || null;
      }

      await Api.request("/portfolio/copy-traders/" + this.trader.id, {
        method: "POST",
        body: JSON.stringify(payload),
      });

      this.close();

      await loadTraders();
      await loadMyCopies();
      renderCopyTabs();
      refreshUnreadDot();

      // Optional success toast
      // toast("Copy trading started with $" + amount.toFixed(2));
    } catch (err) {
      fail(err.message || "Could not start copy trading.");
      this.confirmBtn.disabled = false;
      this.confirmBtn.textContent = "Confirm & start";
    }
  },

  async connectWalletForPayment() {
    // Reuse the same provider detection logic as connectWallet().
    // We just need an address + optional tx signature here.

    if (typeof window.ethereum !== "undefined") {
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        if (!accounts || !accounts.length) return null;

        // Optional: request a personal_sign so the backend can verify ownership.
        // Remove this block if your backend only needs the address.
        let txHash = null;
        try {
          const message = `Authorize copy-trade payment of $${parseFloat(this.amountEl.value).toFixed(2)} to trader ${this.trader.id}`;
          txHash = await window.ethereum.request({
            method: "personal_sign",
            params: [message, accounts[0]],
          });
        } catch (_) { /* user declined signature, but let backend decide */ }

        return {
          wallet_id: "metamask",
          address: accounts[0],
          tx_hash: txHash,
        };
      } catch (err) {
        if (err.code === 4001) return null;
        this.errorEl.textContent = "Wallet error: " + (err.message || "unknown");
        this.errorEl.style.display = "block";
        return null;
      }
    }

    if (window.solana && window.solana.isPhantom) {
      try {
        const resp = await window.solana.connect();
        return {
          wallet_id: "phantom",
          address: resp.publicKey.toString(),
          tx_hash: null,
        };
      } catch (err) {
        return null;
      }
    }

    this.errorEl.textContent =
      "No wallet extension detected. Install MetaMask or Phantom, or pay from your account balance.";
    this.errorEl.style.display = "block";
    return null;
  },

  async function loadOverviewData() {
    const amtEl     = document.getElementById("bc-amount");
    const profitEl  = document.getElementById("kpi-profit");
    const growthEl  = document.getElementById("kpi-growth");
    const depositEl = document.getElementById("kpi-deposit");
    const withdrawEl= document.getElementById("kpi-withdraw");
    const railBal   = document.getElementById("rail-balance");
    const sbBal     = document.getElementById("sb-balance-value");

    try {
      const data = await Api.request("/portfolio");
      if (!data || data.status === "no_account") {
        if (amtEl) amtEl.textContent = "$0.00";
        if (railBal) railBal.textContent = "$0.00";
        if (sbBal) sbBal.textContent = "$0.00";
      } else {
        const positions = data.positions || [];
        const account = data.account || {};
        const value = parseFloat(account.portfolio_value || 0);
        const total = value || positions.reduce((s, p) => s + parseFloat(p.market_value || 0), 0);
        const totalPL = positions.reduce((s, p) => s + parseFloat(p.unrealized_pl || 0), 0);
        const totalCost = total - totalPL;
        const growthPct = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;

        if (amtEl) amtEl.textContent = fmtMoney(total);
        if (railBal) railBal.textContent = fmtMoney(total);
        if (sbBal) sbBal.textContent = fmtMoney(total);
        if (profitEl) {
          profitEl.textContent = fmtMoneySigned(totalPL);
          profitEl.className = "st-value " + (totalPL > 0 ? "up" : totalPL < 0 ? "down" : "");
        }
        if (growthEl) {
          const dir = growthPct >= 0 ? "up" : "down";
          growthEl.innerHTML = `<span class="trend ${dir}">${growthPct >= 0 ? "+" : ""}${growthPct.toFixed(2)}%</span> Growth`;
        }
      }
    } catch (err) {
      if (amtEl) amtEl.textContent = "$0.00";
    }

    try {
      const transfers = await Api.request("/banking/transfers");
      state.transfers = transfers || [];
      let dep = 0, wd = 0;
      state.transfers.forEach(t => {
        const a = parseFloat(t.amount_usd || 0);
        if (t.direction === "deposit") dep += a;
        if (t.direction === "withdrawal") wd += a;
      });
      if (depositEl) depositEl.textContent = fmtMoney(dep);
      if (withdrawEl) withdrawEl.textContent = fmtMoney(wd);
      renderActivity(state.transfers.slice(0, 6));
    } catch (err) {
      renderActivity([]);
    }

    try {
      const kyc = await Api.request("/kyc");
      state.kyc = kyc;
      updateKycStatus();

      // Re-render the topbar's verified badge with fresh KYC state
      const badgeWrap = document.querySelector(".tb-right");
      if (badgeWrap) {
        const old = badgeWrap.querySelector(".tb-verified");
        if (old) {
          const temp = document.createElement("div");
          temp.innerHTML = renderVerifiedBadge();
          badgeWrap.replaceChild(temp.firstChild, old);
        }
      }
    } catch (err) {}
  }

  function renderWallets() {

            : `<button class="wc-btn ${w.color}" data-wallet-connect="${w.id}">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>

        </div>
      `;
    }).join("");

    grid.querySelectorAll("[data-wallet-connect]").forEach(btn => {
      btn.addEventListener("click", () => connectWallet(btn.dataset.walletConnect));
    });

      btn.addEventListener("click", () => disconnectWallet(btn.dataset.walletDisconnect));
    });
  }

  async function connectWallet(walletId) {
    const wallet = WALLETS.find(w => w.id === walletId);
    if (!wallet) return;

    if (wallet.requiresExtension === "ethereum") {
      if (typeof window.ethereum !== "undefined") {
        try {
          const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
          if (accounts && accounts.length) {
            await saveWallet(wallet.id, accounts[0], "ethereum");
            return;
          }
        } catch (err) {
          if (err.code === 4001) {
            alert("Connection cancelled.");
          } else {
            alert("Could not connect: " + (err.message || "Unknown error"));
          }
          return;
        }
      } else {
        alert(wallet.name + " browser extension not detected.\n\nInstall " + wallet.name + ", then reload this page.\n\nWe never ask for your seed phrase — the connection happens entirely inside your wallet.");
        return;
      }
    }

    if (wallet.requiresExtension === "solana") {
      if (window.solana && window.solana.isPhantom) {
        try {
          const resp = await window.solana.connect();
          await saveWallet(wallet.id, resp.publicKey.toString(), "solana");
          return;
        } catch (err) {
          alert("Connection cancelled.");
          return;
        }
      } else {
        alert("Phantom not detected.\n\nInstall Phantom from phantom.app, then reload this page.\n\nWe never ask for your seed phrase.");
        return;
      }
    }

    alert(wallet.name + " integration is in progress.\n\nOnce our custody partner is live, this will open the official " + wallet.name + " approval window.\n\nWe never ask for your seed phrase — ever.");
  }

    async function saveWallet(walletId, address, chain) {
    try {
      await Api.wallets.link({ wallet_id: walletId, address: address, chain: chain });
      await loadWallets();
      renderWallets();
      updateWalletCounts();
      alert("Wallet connected: " + address.slice(0, 6) + "…" + address.slice(-4));
    } catch (err) {
      // Fall back to localStorage if backend endpoint isn't ready
      const record = { wallet_id: walletId, address: address, chain: chain };
      const stored = JSON.parse(localStorage.getItem("wsc_wallets") || "[]");
      stored.push(record);
      localStorage.setItem("wsc_wallets", JSON.stringify(stored));
      alert("Wallet saved locally (backend endpoint not yet live): " + address.slice(0, 6) + "…" + address.slice(-4));
    }
  }
 
  async function disconnectWallet(walletId) {
    if (!confirm("Disconnect this wallet?")) return;
    try {
      await Api.wallets.unlink(walletId);
    } catch (err) {
      const stored = JSON.parse(localStorage.getItem("wsc_wallets") || "[]")
        .filter(w => w.wallet_id !== walletId);
      localStorage.setItem("wsc_wallets", JSON.stringify(stored));
    }
    await loadWallets();
    renderWallets();
    updateWalletCounts();
  }

  async function loadPortfolioPage() {
    const valEl = document.getElementById("pf-value");
    const costEl = document.getElementById("pf-cost");
    const plEl = document.getElementById("pf-pl");
    const pctEl = document.getElementById("pf-pl-pct");
    const assetEl = document.getElementById("pf-assets");
    const countEl = document.getElementById("pf-count");
    const tableEl = document.getElementById("pf-holdings-table");

    try {

        [valEl, costEl, plEl].forEach(e => e && (e.textContent = "$0.00"));
        if (assetEl) assetEl.textContent = "0";
        if (countEl) countEl.textContent = "0 positions";
        if (tableEl) tableEl.innerHTML = `<div class="empty-state">No brokerage account yet. <a href="/kyc.html">Complete KYC</a>.</div>`;
        if (typeof renderPortfolio3D === "function") renderPortfolio3D("portfolio-canvas", []);
        return;
      }
      const positions = data.positions || [];
      const totalValue = positions.reduce((s, p) => s + parseFloat(p.market_value || 0), 0);
      const totalPL    = positions.reduce((s, p) => s + parseFloat(p.unrealized_pl || 0), 0);
      const totalCost  = totalValue - totalPL;
      const growthPct  = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;

      if (valEl) valEl.textContent = fmtMoney(totalValue);
      if (costEl) costEl.textContent = fmtMoney(totalCost);
      if (plEl) {
        plEl.textContent = fmtMoneySigned(totalPL);
        plEl.className = "kpi-value " + (totalPL > 0 ? "up" : totalPL < 0 ? "down" : "");
      }
      if (pctEl) pctEl.innerHTML = `<span class="trend ${growthPct >= 0 ? "up" : "down"}">${growthPct >= 0 ? "+" : ""}${growthPct.toFixed(2)}%</span> vs cost basis`;
      if (assetEl) assetEl.textContent = positions.length;
      if (countEl) countEl.textContent = positions.length + " position" + (positions.length === 1 ? "" : "s");

      if (typeof renderPortfolio3D === "function") renderPortfolio3D("portfolio-canvas", positions);

      if (!positions.length) {
        if (tableEl) tableEl.innerHTML = `<div class="empty-state">No open positions yet.</div>`;
        return;
      }

      const rows = positions.map(p => {
        const pl = parseFloat(p.unrealized_pl || 0);
        return `<tr>
          <td class="sym">${escapeHtml(p.symbol)}</td>
          <td class="mono">${parseFloat(p.qty).toLocaleString(undefined, { maximumFractionDigits: 4 })}</td>
          <td class="mono">${fmtMoney(p.market_value)}</td>
          <td class="${pl > 0 ? "up" : pl < 0 ? "down" : "mono"}">${fmtMoneySigned(pl)}</td>
        </tr>`;
      }).join("");

      if (tableEl) tableEl.innerHTML = `<table class="holdings-table">
        <thead><tr><th>Symbol</th><th>Qty</th><th>Value</th><th>Unrealized P/L</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    } catch (err) {
      if (tableEl) tableEl.innerHTML = `<div class="empty-state">Could not load: ${escapeHtml(err.message)}</div>`;
    }
  }

    function traderCardHtml(t, isMine) {

    // Star rendering
    const fullStars = Math.round(rating);
    let starsHtml = "";
    for (let i = 1; i <= 5; i++) {
      starsHtml += `<span class="star ${i <= fullStars ? "filled" : "empty"}">★</span>`;

  function notifIcon(kind) {
    if (kind === "referral") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>';
    if (kind === "loan") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>';
    if (kind === "kyc" || kind === "welcome") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/><path d="m9 12 2 2 4-4"/></svg>';
    if (kind === "transfer") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l-4-4 4-4"/><path d="M3 13h12a4 4 0 0 0 4-4V4"/><path d="M17 7l4 4-4 4"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  }

  function timeAgo(iso) {
    try {
      const then = new Date(iso).getTime();
      const diff = Math.max(0, Date.now() - then);
      const min = Math.floor(diff / 60000);
      if (min < 1) return "Just now";
      if (min < 60) return min + "m ago";
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + "h ago";
      const days = Math.floor(hr / 24);
      if (days < 7) return days + "d ago";
      return new Date(iso).toLocaleDateString();
    } catch (e) { return ""; }
  }

      document.addEventListener("click", (e) => {
        if (!notifPanel.contains(e.target) && e.target !== notifBtn && !notifBtn.contains(e.target)) {
          notifPanel.classList.remove("open");
        }
      });
    }

    if (notifMarkAll) {
      notifMarkAll.addEventListener("click", async () => {
        try {
          await Api.notifications.markAll();
          await loadNotifications();
          await refreshUnreadDot();
        } catch (err) { /* silent */ }
      });
    }

    // Initial unread count check
    refreshUnreadDot();
    
    const rCopy = document.getElementById("refer-copy");
    const rInput = document.getElementById("refer-input");
    if (rCopy && rInput) {
      rCopy.addEventListener("click", () => {
        rInput.select();
        document.execCommand("copy");
        rCopy.textContent = "Copied";
        setTimeout(() => { rCopy.textContent = "Copy"; }, 1500);
      });
    }

    bindPageLinks(document);
    renderPage();
  }
// ---- Copy-trade payment modal -------------------------------------
